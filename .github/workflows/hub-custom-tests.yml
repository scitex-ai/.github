name: hub-custom-tests
jobs:
  runner-admission:
    uses: ./.github/workflows/runner-admission.yml
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu","scitex-docker"]'
  typescript-check:
    name: TypeScript Compilation & Linting
    needs:
    - runner-admission
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
      && fromJSON('["ubuntu-latest"]') || fromJSON(needs.runner-admission.outputs.runs_on) }}
    steps:
    - name: Refuse to run fork-authored code on self-hosted infrastructure
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && runner.environment
        == 'self-hosted'
      run: |
        echo "::error::Fork-authored code is not run on self-hosted infrastructure."
        echo "Review with gh pr checkout; public contributors receive the complete hosted validation graph."
        exit 1
    - name: Require confirmed organization membership on native runners
      if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
      run: |
        echo "::error::Organization membership admission was not confirmed."
        exit 1
    - name: Require the fixed Hub repository before checkout
      env:
        EXPECTED_REPOSITORY: scitex-ai/scitex-hub
      run: |
        test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
    - name: Checkout code
      uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v7
      with:
        cache-dependency-glob: pyproject.toml
    - name: Install workspace apps
      run: |
        set -euo pipefail
        # uv venv, not bare pip: the pool's toolcache Python is uv-managed
        # and refuses pip under PEP 668, and these runners are org-pooled
        # so the shared interpreter must not be mutated.
        #
        # --seed is REQUIRED here, unlike the other migrated jobs. `uv venv`
        # creates a venv with NO pip in it. That is fine when every install
        # goes through `uv pip install --python .venv/bin/python`, but
        # install_apps.sh shells plain `pip` as its documented fallback
        # (scripts/apps/install_apps.sh: "Always fall back to plain pip").
        # Without --seed there is no .venv/bin/pip for the PATH below to
        # resolve, so that fallback escapes the venv and mutates whatever
        # interpreter the shared pooled runner has — the exact thing the
        # comment above says must not happen, failing silently rather than
        # loudly. --seed puts pip in the venv so the fallback stays jailed.
        uv venv --seed --python 3.11 .venv
        # Floor kept in step with pyproject.toml's declaration (>=0.21.0).
        # It read >=0.2.0 until 2026-08-18 -- fourteen minor versions below
        # what hub declares. That never failed, because `>=` resolves to the
        # newest release, so CI happened to install a version that satisfied
        # a constraint CI did not state. A second, lower floor that is only
        # ever right by accident is the kind of disagreement that surfaces
        # the day someone pins for an unrelated reason.
        uv pip install --python .venv/bin/python "scitex-ui>=0.21.0"
        # install_apps.sh shells `pip`/`python` itself, so put the venv
        # ahead of anything the shared runner has on PATH.
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        export PATH="$PWD/.venv/bin:$PATH"
        # Real source-only Node leaves are absent from their Python wheels.
        # Acquire the selected immutable siblings before the existing app
        # installer. Its --clone mode reuses existing roots without sync/reset.
        python3 scripts/apps/prepare_frontend_sources.py
        bash scripts/apps/install_apps.sh --clone
        # This is Hub's selected Python SDK; Fig's separate Node-only SDK
        # remains the genuine 0.3.0 source declared by its own package.json.
        uv pip install --python .venv/bin/python "scitex-sdk==0.3.2"
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm run frontend:install
    - name: Build with Vite
      run: npm run build
  vitest:
    name: Vitest Unit Tests
    needs:
    - runner-admission
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
      && fromJSON('["ubuntu-latest"]') || fromJSON(needs.runner-admission.outputs.runs_on) }}
    steps:
    - name: Refuse to run fork-authored code on self-hosted infrastructure
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && runner.environment
        == 'self-hosted'
      run: |
        echo "::error::Fork-authored code is not run on self-hosted infrastructure."
        echo "Review with gh pr checkout; public contributors receive the complete hosted validation graph."
        exit 1
    - name: Require confirmed organization membership on native runners
      if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
      run: |
        echo "::error::Organization membership admission was not confirmed."
        exit 1
    - name: Require the fixed Hub repository before checkout
      env:
        EXPECTED_REPOSITORY: scitex-ai/scitex-hub
      run: |
        test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
    - name: Checkout code
      uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v7
      with:
        cache-dependency-glob: pyproject.toml
    - name: Prepare frontend sources and Python context
      run: |
        set -euo pipefail
        uv venv --python 3.11 .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        export PATH="$PWD/.venv/bin:$PATH"
        python3 scripts/apps/prepare_frontend_sources.py
        # Vite's existing UI entry discovery uses the selected Python UI.
        # Install its genuine source and the separately selected public SDK.
        uv pip install --python .venv/bin/python -e ../scitex-ui "scitex-sdk==0.3.2"
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm run frontend:install
    - name: Run tests
      run: npm run test:run
  terminal-tests:
    name: Terminal Broker & Session Tests (Python)
    needs:
    - runner-admission
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
      && fromJSON('["ubuntu-latest"]') || fromJSON(needs.runner-admission.outputs.runs_on) }}
    container:
      image: |-
        ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
            && '' || 'buildpack-deps:noble' }}
      options: --cpus 4 --memory 8g
    steps:
    - name: Refuse to run fork-authored code on self-hosted infrastructure
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && runner.environment
        == 'self-hosted'
      run: |
        echo "::error::Fork-authored code is not run on self-hosted infrastructure."
        echo "Review with gh pr checkout; public contributors receive the complete hosted validation graph."
        exit 1
    - name: Require confirmed organization membership on native runners
      if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
      run: |
        echo "::error::Organization membership admission was not confirmed."
        exit 1
    - name: Require the fixed Hub repository before checkout
      env:
        EXPECTED_REPOSITORY: scitex-ai/scitex-hub
      run: |
        test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
    - name: Checkout code
      uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v7
      with:
        cache-dependency-glob: pyproject.toml
    - name: Install dependencies
      run: |
        uv venv --python 3.11 .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        set --
        if [ -f requirements-dev-source.txt ]; then
          set -- -r requirements-dev-source.txt
        fi
        for attempt in 1 2 3; do
          if uv pip install --python .venv/bin/python -e ".[all,dev]" "$@"; then
            exit 0
          fi
          echo "::warning::uv pip install -e .[all,dev] attempt ${attempt} failed; retrying in 15s"
          sleep 15
        done
        echo "::error::uv pip install -e .[all,dev] failed after 3 attempts"
        exit 1
    - name: Verify test environment is complete
      run: python -c "import celery, pytest_django; print('terminal-test env OK')"
    - name: Run terminal tests
      env:
        SCITEX_HUB_DJANGO_SECRET_KEY: ci-test-key
        SCITEX_HUB_GITEA_SSH_PORT_DEV: '2222'
      run: |
        python -m pytest \
          tests/apps/console_app/views/terminal/ \
          tests/apps/console_app/services/terminal_broker/ \
          -v --tb=short -p no:playwright -o "addopts="
  security-regression:
    name: Security Regression Gates (tests/security/)
    needs:
    - runner-admission
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
      && fromJSON('["ubuntu-latest"]') || fromJSON(needs.runner-admission.outputs.runs_on) }}
    container:
      image: |-
        ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
            && '' || 'buildpack-deps:noble' }}
      options: --cpus 4 --memory 8g
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scitex_test
          POSTGRES_USER: scitex
          POSTGRES_PASSWORD: scitex_test_pass
        ports:
        - 5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - name: Refuse to run fork-authored code on self-hosted infrastructure
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && runner.environment
        == 'self-hosted'
      run: |
        echo "::error::Fork-authored code is not run on self-hosted infrastructure."
        echo "Review with gh pr checkout; public contributors receive the complete hosted validation graph."
        exit 1
    - name: Require confirmed organization membership on native runners
      if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
      run: |
        echo "::error::Organization membership admission was not confirmed."
        exit 1
    - name: Require the fixed Hub repository before checkout
      env:
        EXPECTED_REPOSITORY: scitex-ai/scitex-hub
      run: |
        test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
    - name: Checkout code
      uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v7
      with:
        cache-dependency-glob: pyproject.toml
    - name: Install dependencies
      run: |
        uv venv --python 3.11 .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        set --
        if [ -f requirements-dev-source.txt ]; then
          set -- -r requirements-dev-source.txt
        fi
        for attempt in 1 2 3; do
          if uv pip install --python .venv/bin/python -e ".[all,dev]" "$@"; then
            exit 0
          fi
          echo "::warning::uv pip install -e .[all,dev] attempt ${attempt} failed; retrying in 15s"
          sleep 15
        done
        echo "::error::uv pip install -e .[all,dev] failed after 3 attempts"
        exit 1
    - name: Verify test environment is complete
      run: python -c "import celery, pytest_django; print('security-test env OK')"
    - name: Run security regression suite
      env:
        GIT_CONFIG_COUNT: '2'
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: ''
        GIT_CONFIG_KEY_1: safe.directory
        GIT_CONFIG_VALUE_1: ${{ github.workspace }}
        SCITEX_HUB_DJANGO_SECRET_KEY: ci-test-key
        SCITEX_HUB_GITEA_SSH_PORT_DEV: '2222'
        SCITEX_HUB_DB_NAME_DEV: scitex_test
        SCITEX_HUB_DB_USER_DEV: scitex
        SCITEX_HUB_DB_PASSWORD_DEV: scitex_test_pass
        SCITEX_HUB_DB_HOST_DEV: ${{ job.container.id && 'postgres' || 'localhost' }}
        SCITEX_HUB_DB_PORT_DEV: ${{ job.container.id && '5432' || job.services.postgres.ports['5432'] }}
        SCITEX_HUB_TEST_MODE: '1'
      run: |
        python -c 'import os; from pathlib import Path; p=Path(os.environ["GITHUB_WORKSPACE"]).resolve(); assert p == Path.cwd().resolve(); print("tracked-source", "uid="+str(os.getuid()), "repo_uid="+str(p.stat().st_uid), "home="+os.environ.get("HOME", ""), "workspace="+str(p))'
        git -C "$GITHUB_WORKSPACE" ls-files --error-unmatch tests/tracked_source.py >/dev/null
        python -m pytest \
          tests/security/ \
          -v --tb=short -p no:playwright -o "addopts=" \
          -m security --strict-markers
    - name: Fail if the security suite collected nothing
      env:
        GIT_CONFIG_COUNT: '2'
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: ''
        GIT_CONFIG_KEY_1: safe.directory
        GIT_CONFIG_VALUE_1: ${{ github.workspace }}
        SCITEX_HUB_DJANGO_SECRET_KEY: ci-test-key
        SCITEX_HUB_GITEA_SSH_PORT_DEV: '2222'
        SCITEX_HUB_DB_NAME_DEV: scitex_test
        SCITEX_HUB_DB_USER_DEV: scitex
        SCITEX_HUB_DB_PASSWORD_DEV: scitex_test_pass
        SCITEX_HUB_DB_HOST_DEV: ${{ job.container.id && 'postgres' || 'localhost' }}
        SCITEX_HUB_DB_PORT_DEV: ${{ job.container.id && '5432' || job.services.postgres.ports['5432'] }}
        SCITEX_HUB_TEST_MODE: '1'
      run: |
        COUNT=$(python -m pytest tests/security/ -m security \
          -p no:playwright -o "addopts=" --collect-only -q 2>/dev/null \
          | grep -c '::' || true)
        echo "collected security tests: ${COUNT}"
        if [ "${COUNT}" -lt 1 ]; then
          echo "::error::tests/security/ collected 0 tests — the security gate cannot fail"
          exit 1
        fi
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
    - typescript-check
    - vitest
    - terminal-tests
    - security-regression
    if: always()
    steps:
    - name: Check results
      run: |
        TS_RESULT="${{ needs.typescript-check.result }}"
        TEST_RESULT="${{ needs.vitest.result }}"
        TERMINAL_RESULT="${{ needs.terminal-tests.result }}"
        SECURITY_RESULT="${{ needs.security-regression.result }}"

        echo "TypeScript: $TS_RESULT"
        echo "Vitest: $TEST_RESULT"
        echo "Terminal Tests: $TERMINAL_RESULT"
        echo "Security Regression: $SECURITY_RESULT"

        # Every leg below uses `!= "success"`, never `== "failure"`.
        # A job result is one of success / failure / cancelled /
        # skipped, so `== "failure"` lets a cancelled or skipped job
        # pass the summary — a gate that cannot fail. None of these
        # three jobs carries an `if:` condition or a paths filter, so
        # there is no legitimate skip to tolerate: anything other than
        # success means the check did not actually run green.
        if [ "$TS_RESULT" != "success" ]; then
          echo "TypeScript checks did not pass (result: $TS_RESULT)"
          exit 1
        fi

        if [ "$TEST_RESULT" != "success" ]; then
          echo "Vitest tests did not pass (result: $TEST_RESULT)"
          exit 1
        fi

        if [ "$TERMINAL_RESULT" != "success" ]; then
          echo "Terminal tests did not pass (result: $TERMINAL_RESULT)"
          exit 1
        fi

        # A security regression gate that is skipped or cancelled is
        # not a gate — only "success" is acceptable here.
        if [ "$SECURITY_RESULT" != "success" ]; then
          echo "Security regression gates did not pass (result: $SECURITY_RESULT)"
          exit 1
        fi

        echo "CI checks completed"
'on':
  workflow_call: null
permissions:
  contents: read
