name: fd-fclones-integration

# Shared fd/fclones integration callee for scitex-ai/scitex-storage.
# Wait only for actual APT lock contention; other bootstrap failures stay failures.
#
# Shared admission runs before checkout. Trusted actors use the Organization
# group; forks and unlisted actors use GitHub-hosted runners.
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  runner-admission:
    uses: ./.github/workflows/runner-admission.yml
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'

  native:
    needs: runner-admission
    runs-on: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
          && fromJSON('["ubuntu-latest"]')
          || fromJSON(needs.runner-admission.outputs.runs_on) }}
    env:
      PYTHONNOUSERSITE: 1
    steps:
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted SciTeX organization CPU pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1
      - name: Require allowlisted actor on native runners
        if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fd + fclones
        run: |
          set -euo pipefail
          apt_retry_lock() {
            local log code deadline=$((SECONDS + 120))
            log=$(mktemp "${RUNNER_TEMP}/apt-lock.XXXXXX")
            while true; do
              if LC_ALL=C "$@" >"$log" 2>&1; then
                cat "$log"
                rm -f -- "$log"
                return 0
              else
                code=$?
              fi
              cat "$log"
              if [[ "$code" -ne 100 ]] ||
                 ! grep -Eq '^E: Could not get lock ' "$log" ||
                 [[ "$SECONDS" -ge "$deadline" ]]; then
                rm -f -- "$log"
                return "$code"
              fi
              echo '::notice::APT lock busy; waiting for its owner (maximum 120 seconds).' >&2
              sleep 2
            done
          }
          apt_retry_lock sudo apt-get update -y
          apt_retry_lock sudo apt-get install -y fd-find
          FCLONES_VERSION=0.35.0
          FCLONES_URL="https://github.com/pkolaczk/fclones/releases/download/v${FCLONES_VERSION}/fclones_${FCLONES_VERSION}-1_amd64.deb"
          FCLONES_DEB=$(mktemp "${RUNNER_TEMP}/fclones.XXXXXX.deb")
          trap 'rm -f -- "$FCLONES_DEB"' EXIT
          # Retry: this is the ONLY job that exercises fd and fclones for real
          # (the matrix skips those tests -- see tests/conftest.py), so a
          # transient network blip here does not merely red a check, it means
          # that coverage SILENTLY DID NOT RUN. Seen 2026-08-15: a bare
          # `curl -fsSL` died with "curl: (35) Recv failure: Connection reset
          # by peer" and the job never reached pytest at all.
          if ! curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
                 -o "$FCLONES_DEB" "$FCLONES_URL"; then
            # Name the artifact and the URL. The bare exit code 35 that this
            # replaces looks identical to a test failure in the checks list,
            # which cost an investigation before anyone read the log.
            echo "::error::Could not download the fclones .deb after 3 retries."
            echo "::error::URL: ${FCLONES_URL}"
            echo "::error::This is a NETWORK failure in the install step, NOT a test failure."
            exit 1
          fi
          apt_retry_lock sudo apt-get install -y "$FCLONES_DEB"
          fdfind --version
          fclones --version
      - name: Install scitex-storage[dev]
        run: |
          set -euo pipefail
          profile=$(mktemp -d "${RUNNER_TEMP}/storage-python.XXXXXX")
          python -m venv "$profile"
          "$profile/bin/python" -m pip install -e '.[dev]'
          printf '%s\n' "$profile/bin" >> "$GITHUB_PATH"
      - name: Install matching Chromium for required browser regressions
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH
          PLAYWRIGHT_BROWSERS_PATH=$(mktemp -d "${RUNNER_TEMP}/storage-browsers.XXXXXX")
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          python -m playwright install --only-shell chromium
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as runtime:
              # Use Playwright's default headless-shell implementation. The
              # fresh job-owned cache must contain exactly one Linux binary.
              executables = list(Path(os.environ["PLAYWRIGHT_BROWSERS_PATH"])
                                 .rglob("chrome-headless-shell"))
              if len(executables) != 1 or not executables[0].is_file():
                  raise RuntimeError("Required matching headless Chromium was not installed")
              executable = str(executables[0])
              with open(os.environ["GITHUB_ENV"], "a") as output:
                  output.write(f"SCITEX_STORAGE_TEST_CHROMIUM={executable}\n")
              browser = runtime.chromium.launch(
                  executable_path=executable, args=["--no-sandbox"]
              )
              browser.close()
          PY
      - name: Run tests with fd/fclones on PATH
        run: pytest "$GITHUB_WORKSPACE/tests/" -q
