name: hub-pytest-matrix
jobs:
  runner-admission:
    uses: ./.github/workflows/runner-admission.yml
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu","scitex-docker"]'
  test:
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
      && fromJSON('["ubuntu-latest"]') || fromJSON(needs.runner-admission.outputs.runs_on) }}
    container:
      image: |-
        ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
            && '' || 'buildpack-deps:noble' }}
      options: --user 1000:1000 --cpus 8 --memory 16g
      volumes:
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        - '3.13'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scitex_test
          POSTGRES_USER: scitex
          POSTGRES_PASSWORD: scitex_test_pass
        ports:
        - 5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - name: Refuse to run fork-authored code on self-hosted infrastructure
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && runner.environment
        == 'self-hosted'
      run: |
        echo "::error::Fork-authored code is not run on self-hosted infrastructure."
        echo "Review with gh pr checkout; public contributors receive the complete hosted validation graph."
        exit 1
    - name: Require confirmed organization membership on native runners
      if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
      run: |
        echo "::error::Organization membership admission was not confirmed."
        exit 1
    - name: Require the fixed Hub repository before checkout
      env:
        EXPECTED_REPOSITORY: scitex-ai/scitex-hub
      run: |
        test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
    - uses: actions/checkout@v4
    - name: Check out Writer's compile gate
      uses: actions/checkout@v4
      with:
        repository: scitex-ai/scitex-writer
        ref: develop
        path: .ci/scitex-writer
        sparse-checkout: |
          scripts/python
        sparse-checkout-cone-mode: true
    - uses: astral-sh/setup-uv@v7
      with:
        cache-dependency-glob: pyproject.toml
    - name: Install dependencies (py${{ matrix.python-version }})
      run: |
        set -euo pipefail
        # --seed installs pip/setuptools into the venv. uv itself does not
        # need pip, so a bare `uv venv` omits it — but tests/scitex_hub/apps/
        # apps_app/services/test_user_app_install_e2e.py shells out to
        # `python -m pip install` to exercise the REAL user-app install path,
        # and died with "No module named pip" (measured, run 30331030951).
        # setup-python always provided a pip, so nothing here depended on it
        # explicitly. Seed the venv rather than rewriting those tests to use
        # uv: they are correct as written — they exercise the same installer
        # the product uses, with no mocks.
        uv venv --seed --python ${{ matrix.python-version }} .venv
        set --
        if [ -f requirements-dev-source.txt ]; then
          set -- -r requirements-dev-source.txt
        fi
        uv pip install --python .venv/bin/python -e ".[all,dev]" "$@"
    - name: Run tests
      env:
        SCITEX_WRITER_SOURCE: ${{ github.workspace }}/.ci/scitex-writer
        SCITEX_HUB_DJANGO_SECRET_KEY: ci-test-secret-do-not-use-in-prod
        SCITEX_HUB_GITEA_SSH_PORT_DEV: '2222'
        SCITEX_HUB_DB_NAME_DEV: scitex_test
        SCITEX_HUB_DB_USER_DEV: scitex
        SCITEX_HUB_DB_PASSWORD_DEV: scitex_test_pass
        SCITEX_HUB_DB_HOST_DEV: ${{ job.container.id && 'postgres' || 'localhost' }}
        SCITEX_HUB_DB_PORT_DEV: ${{ job.container.id && '5432' || job.services.postgres.ports['5432'] }}
        PYTEST_XDIST_WORKERS: ${{ job.container.id && '8' || 'auto' }}
        SCITEX_HUB_TEST_MODE: '1'
      run: |
        set -euo pipefail
        # .venv/bin on PATH so any tool the suite shells out to (e.g. the
        # audit gate's scitex-dev subcommands) resolves to THIS venv rather
        # than to whatever the shared runner happens to have installed.
        export PATH="$PWD/.venv/bin:$PATH"
        # loadgroup with tests/conftest.py's groups: one per file (intra-file
        # order unchanged), visitor_pool as one. Each worker gets its own test
        # database from pytest-django.
        .venv/bin/python -m pytest tests/ -n "$PYTEST_XDIST_WORKERS" --dist loadgroup --cov=src/scitex_hub --cov-report=xml --cov-report=term
    - name: Upload coverage to Codecov
      if: always() && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
    needs:
    - runner-admission
'on':
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
permissions:
  contents: read
