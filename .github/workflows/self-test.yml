name: self-test

# The reusable workflows in this repo are the org's shared CI implementation.
# A defect here is a defect in every repo that calls it — so the workflows
# themselves get tests, and those tests run on every change to this repo.
#
# tests/test_auto_merge_dispatch.py is file-only (parses the YAML, asserts on
# the shell body). No network, no gh, cannot flake.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # SUPERSEDED RULE, RECORDED NOT ASSERTED. The "ZERO GitHub-hosted runners
    # (operator mandate 2026-07-14, enforced as PS-169)" rule that stood here
    # was replaced by the operator's 2026-08-05 direction: stop using Spartan
    # for CI, prefer our own many-core machines, treat GitHub-hosted runners as
    # an acceptable-but-slower fallback. Hosted runners are no longer forbidden.
    #
    # The label below is UNCHANGED and this is deliberate. Unlike its siblings
    # in this directory, self-test.yml is not a reusable workflow (push /
    # pull_request / workflow_dispatch), so it has no callers and takes no
    # `runs_on` input — a parameter here would have exactly one possible value.
    # It moves when this repo's own CI moves, as its own decision.
    #
    # The comment is corrected now anyway, because "cannot take the input" and
    # "should keep asserting a dead rule" are different questions, and this is
    # the org repo that DEFINES the rule — a stale mandate stated as current
    # here is the one most likely to be read as authoritative and copied out.
    # Moved off `spartan-cpu` 2026-08-15, when all four carriers of that label
    # were offline and this job — the org repo's OWN gate — was queuing forever
    # like everyone else's. A gate that cannot run is not a gate; hosted is
    # slower and always there.
    runs-on: [ubuntu-latest]
    steps:
      # FORK GUARD — MUST BE THE FIRST STEP, AHEAD OF actions/checkout, which is
      # what first puts fork-authored content on the node. Rationale, the two
      # operator mandates it reconciles, and what it deliberately does NOT stop:
      # README.md "Fork guard". Ordering and predicate are asserted in
      # tests/test_fork_guard.py — do not reorder, do not reword the `if`.
      #
      # This file is NOT a reusable workflow, so a fork PR to THIS repo carries
      # its own copy of this guard and can delete it. That is not a reason to
      # omit it — it is the reason the approval policy, not this step, is the
      # boundary. See the README section.
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted Spartan pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1
      - uses: actions/checkout@v5
      # uv, not actions/setup-python: setup-python wants a runner tool-cache
      # that the Spartan image does not populate. Every other workflow here
      # already builds its interpreter with uv, so this follows the pattern
      # that is proven to work on this pool rather than inventing a new one.
      - uses: astral-sh/setup-uv@v7
      - name: install
        run: |
          set -euo pipefail
          uv venv --seed --python 3.12 .venv
          uv pip install --python .venv/bin/python pytest pyyaml
      - name: run workflow contract tests
        run: .venv/bin/python -m pytest tests/ -v
