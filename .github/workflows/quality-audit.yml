name: quality-audit

# REUSABLE WORKFLOW — org-level pilot (scitex-stats, 2026-07-10).
# Mechanically extracted from the `audit` job in scitex-ai/scitex-stats
# `.github/workflows/ci.yml`.
#
# JUDGMENT CALL: the task brief assumed this job runs
# `scitex-dev ecosystem audit-all <pkg> --new-only` with the package name
# passed in, and therefore needs an `inputs:` parameter. The ACTUAL current
# job computes `DIST` itself from `pyproject.toml` in the checkout
# (`scitex-dev ecosystem audit-all "$DIST" --path "$PWD"`, no --new-only
# flag) — so no per-repo input is needed today. Left input-free to match
# the real source exactly; add an input later only if a caller needs to
# override the derived package name.

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          Runner label set for this job, as a JSON ARRAY STRING (it is consumed
          by fromJSON). DEFAULTS TO GITHUB-HOSTED, because a default must FAIL
          SAFE. It defaulted to the Spartan pool until 2026-08-15, when all
          four `spartan-cpu` runners went offline and every caller that passes
          nothing -- which was every caller, since no shipped stub passes this
          input -- silently requested a label no online machine served: 57
          queued runs across ~30 repositories, while the repo-level CI_RUNS_ON
          variables set on 76 of 76 repos had no effect at all, because THIS
          input selects the runner and nothing was passing it. A hosted default
          degrades to SLOWER; a self-hosted default degrades to NEVER. Pass
          `runs_on` to prefer our own hardware -- Spartan stays PREFERRED where
          it is faster (operator, 2026-08-13); this line only decides what
          happens when a caller is silent.
          MUST be a JSON string, not a YAML list: a YAML list decodes to
          something fromJSON rejects, and the resulting label mismatch makes
          the job QUEUE FOREVER rather than fail, which is indistinguishable
          from "still waiting" in the run list.
        type: string
        required: false
        default: '["ubuntu-latest"]'
      scitex_dev_version:
        description: >-
          PEP 440 specifier for scitex-dev, which supplies THE RULE CORPUS this
          job grades against. PINNED BY DEFAULT, because for an audit gate the
          corpus IS the definition of passing: an unpinned install lets the
          pass/fail criterion change under every caller with ZERO DIFF in their
          repository. That is not hypothetical. scitex-hub measured it on
          2026-07-28: the IDENTICAL tree fa16e8eb4 audited GREEN at
          2026-07-27T15:32Z and RED WITH 170 ERRORS at 2026-07-28T04:17Z,
          because scitex-dev 0.38.0 was published in between. Nobody could tell
          "we regressed" from "the corpus moved", and bisection was silently
          defeated -- the tree under test never changed.
          The consequence runs the other way too: whoever cuts a scitex-dev
          release redefines green for every caller at once, which is far more
          blast radius than an unconstrained `pip install` should carry.
          So corpus bumps land HERE, as a reviewable one-line change, instead of
          arriving as a side effect of someone else's release timing.
          Callers may override to trial a newer corpus before it is adopted
          org-wide. An EMPTY string restores the old unpinned behaviour and is
          deliberately NOT the default.
        type: string
        required: false
        default: '==0.49.3'

jobs:
  audit:
    name: audit
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 15
    steps:
      # FORK GUARD — MUST BE THE FIRST STEP, AHEAD OF actions/checkout, which is
      # what first puts fork-authored content on the node. Rationale, the two
      # operator mandates it reconciles, and what it deliberately does NOT stop:
      # README.md "Fork guard". Ordering and predicate are asserted in
      # tests/test_fork_guard.py — do not reorder, do not reword the `if`.
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted Spartan pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml
      - name: Install + audit the workspace
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[all,dev]" \
            || uv pip install --python .venv/bin/python -e ".[dev]" \
            || uv pip install --python .venv/bin/python -e .
          # PINNED — see the `scitex_dev_version` input for why an audit gate
          # must not float its own rule corpus. Quoted as one argument so the
          # specifier's `==` reaches pip rather than the shell.
          uv pip install --python .venv/bin/python "scitex-dev${{ inputs.scitex_dev_version }}"
          # .venv/bin on PATH so audit-all's spawned `scitex-dev` subcommands resolve.
          export PATH="$PWD/.venv/bin:$PATH"
          DIST=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          # --path . audits the CHECKOUT (PR code), not the runner's shared state.
          scitex-dev ecosystem audit-all "$DIST" --path "$PWD"
