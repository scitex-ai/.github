name: writer-release-sif

# Fixed repository, preflight-resolved commit and retained full leaf drivers.
# Source contract only: no image/runtime is registered by this change.
on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      release_tag:
        required: true
        type: string

permissions:
  contents: read

# Compatibility entry point: Writer callers retain their original inputs.
jobs:
  release-driver:
    uses: ./.github/workflows/leaf-release-sif.yml
    with:
      operation: ${{ inputs.operation }}
      source_commit: ${{ inputs.source_commit }}
      release_tag: ${{ inputs.release_tag }}
