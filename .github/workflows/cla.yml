name: cla

# REUSABLE WORKFLOW — org-level pilot (scitex-stats, 2026-07-10).
# Extracted from scitex-ai/scitex-stats `.github/workflows/cla.yml`.
#
# JUDGMENT CALL (not purely mechanical): the source file hardcodes the CLA
# document URL and PR-comment link to `ywatanabe1989/scitex-stats`
# (pre-org-transfer, and repo-specific — a latent bug in the source file
# independent of this migration, since scitex-stats now lives under
# scitex-ai). To make this callable from any repo, the doc URL is rebuilt
# from `${{ github.repository }}`, which for a `workflow_call` run resolves
# to the CALLING repository (not this .github repo) — verified against
# GitHub's reusable-workflow context docs. `default_branch` is an input
# (defaults to `main`) since the CLA.md path assumes the doc lives on the
# repo's default branch. `owner_allowlist` is an input so each repo can
# keep its own allowlisted owner login(s); defaults to the current value.
# Needs GH_PERSONAL_ACCESS_TOKEN (the CLA-signature-storage PAT) from the
# caller; GITHUB_TOKEN is provided automatically. Map it EXPLICITLY — see the
# `secrets:` declaration below. This line used to say `secrets: inherit` was
# needed, which PR #22 made untrue in this very file and nobody updated, so the
# header mandated the thing the declaration twelve lines down exists to avoid.
# A stale comment that contradicts its own file is worse than no comment: a
# reader who trusts it re-introduces the defect while believing they complied.

on:
  workflow_call:
    inputs:
      default_branch:
        description: "Branch the CLA.md document lives on"
        required: false
        type: string
        default: main
      owner_allowlist:
        description: "CLA-assistant allowlist (comma-separated logins/globs)"
        required: false
        type: string
        default: "bot*,ywatanabe1989"
      owner_login:
        description: "Login allowed to direct-push-bypass the CLA check"
        required: false
        type: string
        default: "ywatanabe1989"

    # Declared so a caller can pass this ONE secret explicitly instead of
    # `secrets: inherit`, which forwards EVERY secret the calling repo
    # holds into a job an outsider can start. Backward compatible:
    # `secrets: inherit` keeps working for callers that have not migrated.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN:
        required: true
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  owner-bypass:
    if: github.event_name == 'push' && github.actor == inputs.owner_login
    # ZERO GitHub-hosted runners (operator mandate 2026-07-14). Org pool.
    # WHY THIS DESTINATION IS NOT OBVIOUSLY CORRECT — read before changing.
    #
    # Four facts that are each individually fine and only bite in combination:
    #   1. `issue_comment` and `pull_request_target` are UNAUTHENTICATED
    #      triggers on a public repo. A GitHub account is the whole barrier.
    #   2. The fork-PR approval gate does NOT cover them —
    #      `pull_request_target` runs in the BASE repo's context and
    #      `issue_comment` is not gated at all. These two events are the
    #      documented way AROUND that gate.
    #   3. Self-hosted runners here are PERSISTENT and share a real $HOME
    #      that holds the live fleet credential.
    #   4. This job runs a third-party action.
    #
    # Measured 2026-07-30 (scitex-app): no `actions/checkout` of the PR head,
    # third-party action SHA-pinned, NO code-injection path found. This is a
    # hardening concern, not an active compromise. Unverified by anyone: the
    # pinned action's contents, and whether a fork PR actually reaches here.
    #
    # sac's own repo REFUSED this shape and keeps its CLA job on
    # `ubuntu-latest` with a written PS-224 exemption: "the blocker is
    # SECURITY, not capability, and moving the job to Spartan would be a
    # REGRESSION". An ephemeral hosted VM is destroyed after the run, so a
    # compromise costs one disposable runner.
    #
    # If you are 'fixing' this to satisfy a no-hosted-runners rule: that rule
    # does not model who can TRIGGER a workflow. Escalate instead.
    runs-on: [self-hosted, Linux, X64, spartan-cpu]
    permissions:
      statuses: write
    steps:
      - name: Mark CLAssistant=success on this SHA (owner-allowlisted direct push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/statuses/${SHA}" \
            -f state=success \
            -f context=CLAssistant \
            -f description="Owner-triggered direct push (CLA bypass per repo allowlist)"

  CLAssistant:
    if: github.event_name != 'push'
    # ZERO GitHub-hosted runners (operator mandate 2026-07-14). Org pool.
    # WHY THIS DESTINATION IS NOT OBVIOUSLY CORRECT — read before changing.
    #
    # Four facts that are each individually fine and only bite in combination:
    #   1. `issue_comment` and `pull_request_target` are UNAUTHENTICATED
    #      triggers on a public repo. A GitHub account is the whole barrier.
    #   2. The fork-PR approval gate does NOT cover them —
    #      `pull_request_target` runs in the BASE repo's context and
    #      `issue_comment` is not gated at all. These two events are the
    #      documented way AROUND that gate.
    #   3. Self-hosted runners here are PERSISTENT and share a real $HOME
    #      that holds the live fleet credential.
    #   4. This job runs a third-party action.
    #
    # Measured 2026-07-30 (scitex-app): no `actions/checkout` of the PR head,
    # third-party action SHA-pinned, NO code-injection path found. This is a
    # hardening concern, not an active compromise. Unverified by anyone: the
    # pinned action's contents, and whether a fork PR actually reaches here.
    #
    # sac's own repo REFUSED this shape and keeps its CLA job on
    # `ubuntu-latest` with a written PS-224 exemption: "the blocker is
    # SECURITY, not capability, and moving the job to Spartan would be a
    # REGRESSION". An ephemeral hosted VM is destroyed after the run, so a
    # compromise costs one disposable runner.
    #
    # If you are 'fixing' this to satisfy a no-hosted-runners rule: that rule
    # does not model who can TRIGGER a workflow. Escalate instead.
    runs-on: [self-hosted, Linux, X64, spartan-cpu]
    steps:
      - name: CLA Assistant
        # Upstream v2.6.1 still declares node20. This SciTeX fork changes only
        # action.yml to node24; pin the reviewed commit, not a mutable branch.
        uses: scitex-ai/github-action@114064adf09afb0c8c04703c060862a29ae82c7d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/${{ inputs.default_branch }}/CLA.md"
          branch: "cla-signatures"
          allowlist: ${{ inputs.owner_allowlist }}
          custom-allsigned-prcomment: |
            Thank you for signing the SciTeX CLA. Your contribution can now be reviewed.
          custom-notsigned-prcomment: |
            Please sign the [SciTeX CLA](https://github.com/${{ github.repository }}/blob/${{ inputs.default_branch }}/CLA.md) before your contribution can be merged.
            Comment `I have read and agree to the SciTeX CLA.` to sign.
          # MUST stay byte-identical to the phrase quoted just above. Without
          # this input the action accepts ONLY its own default ("I have read
          # the CLA Document and I hereby sign the CLA"), so the instruction we
          # publish is one the system rejects: a contributor who follows it
          # exactly is told nothing happened, and the check sits stale-FAILURE
          # with no way for them to discover why. Measured 2026-07-23 on
          # figrecipe #319/#320 — the contributor commented the quoted phrase
          # on 07-23 15:56 and both CLA runs that day concluded `failure`.
          # If you edit either string, edit BOTH. They are one contract.
          custom-pr-sign-comment: "I have read and agree to the SciTeX CLA."
