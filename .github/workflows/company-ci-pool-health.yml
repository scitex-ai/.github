name: company CI pool health

on:
  workflow_dispatch:
  schedule:
    # This three-node runtime/Docker sample can take over 30 minutes to drain.
    # Run hourly off-minute to avoid overlapping queued samples; dispatch on demand.
    - cron: '17 * * * *'

permissions: {}

jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        node: ['02', '03', '04']
    uses: ./.github/workflows/runner-health.yml
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu","scitex-compute-${{ matrix.node }}"]'
      verify_docker: true
