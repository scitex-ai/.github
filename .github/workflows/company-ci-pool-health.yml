name: company CI pool health

on:
  workflow_dispatch:
  schedule:
    # Avoid the top-of-hour Actions queue spike; GitHub may delay or drop
    # scheduled runs under load, so keep this lightweight sample off-minute.
    - cron: '7,22,37,52 * * * *'

permissions: {}

jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        node: ['02', '03', '04']
    uses: ./.github/workflows/runner-health.yml
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu","scitex-compute-${{ matrix.node }}"]'
      verify_docker: true
