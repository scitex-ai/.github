name: leaf-release-sif

# Fixed repository, preflight-resolved commit and retained full leaf drivers.
# Writer retains its qualified registration; IO is registered after complete
# native image/runtime/source, private-store and full-suite qualification.
# Browser uses its qualified compute-03 image and a mandatory fresh-wheel probe.
# Registration alone authorizes neither a release tag nor publication.
on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      release_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  runner-admission:
    uses: ./.github/workflows/runner-admission.yml
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'

  profile:
    needs: runner-admission
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.contract.outputs.plan }}
      versions: ${{ steps.contract.outputs.versions }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: contract
        env:
          NATIVE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
          OPERATION: ${{ inputs.operation }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            // BEGIN WRITER_RELEASE_CONTRACT
            // Registration follows actual image/runtime qualification, never a placeholder.
            const CI_CPU_E846 = Object.freeze({
              "sha256": "e8461fc77a2218b5f7e2c475bd601dddaec97c6335bee459a1b0d4e0ca374d83",
              "bytes": 1381281792,
              "producer_revision": "afda87ca15b9560410fff5f331223152df3410b4",
              "source_manifest_sha256": "02f9fdd18cc953ea6b1eedebb862f376128cb6ccf7e9144d5e5ac06325f464eb",
              "public_inventory_sha256": "997e7818bd7da34642a9e23a560ff18ccf5af62f1df011e6785ec0a09590ec88",
              "delivery": null,
              "capabilities": {
                "3.11": "3.11.17",
                "3.12": "3.12.15",
                "3.13": "3.13.16",
                "postgres": "postgres.16.15"
              },
              "native_paths": [
                "/home/ywatanabe/.scitex/dev/runtime/containers/ci-cpu-sha256-e8461fc77a2218b5f7e2c475bd601dddaec97c6335bee459a1b0d4e0ca374d83.sif"
              ]
            });
            const APPTAINER_7BDB = Object.freeze({
              "path": "/usr/bin/apptainer",
              "sha256": "7bdb501fdddbb7264b4e4d6038e0ec27201f63e217519e5f7f0db950c9285ddd",
              "bytes": 48096048,
              "user_namespace": true,
              "sif_mount": true,
              "hosted_delivery_sha256": null
            });
            const REGISTRATION =             {
              "image": CI_CPU_E846,
              "runtime": {...APPTAINER_7BDB, qualification_sha256: "6a178f0d27be734a74df28f5d392f3f54e2bb4b6b2c2aced560ba6b091d08cec"}
            };
            const LEAF_SOURCES = Object.freeze({
              ".github/ci/exec-in-sif.sh": "c07c3bb883b35c7260636f60cc718bad02fffb6bdea6ab5b9002f5e606eeec12",
              ".github/ci/run-in-sif.sh": "bab01584c10e87e6e904d71992c7120a1001e1376af3c88cc7d32750168e4f6a",
              ".github/ci/with-test-postgres.py": "14bff890c251ea5d2dca13e42e8290f9b37ed29b69159258f36aab24c9b82de2",
              ".github/ci/writer_ci_postgres.py": "41269b47454d99baff3459ef830da9312c53716000b386fa92471957cb8bd2e9",
              ".github/ci/build-in-sif.sh": "5c094b4280b4caeb3172449d3a45a440937ed42023add24e4de4f9b9ec97ba89",
              ".github/ci/publish-in-sif.sh": "d7fd488c417a58c01b736072d2ec4da7c00c5475cbb6e5a2759992b3e13794a6",
              ".github/ci/release-identity.py": "5d8abc813d07163ba1551df18e130a71b7a60f025ed0b364370b952792945ffb"
            });
            function requireContract(value, reason) {
              if (!value) throw new Error(reason);
            }
            function exactKeys(value, names) {
              return value && typeof value === 'object' && !Array.isArray(value)
                && Object.keys(value).sort().join('|') === [...names].sort().join('|');
            }
            function digest(value) {
              return typeof value === 'string' && /^[a-f0-9]{64}$/.test(value);
            }
            function publicDelivery(value) {
              if (!exactKeys(value, ['url', 'release_id', 'asset_id', 'redirect_hosts'])) return false;
              if (!Number.isSafeInteger(value.release_id) || value.release_id <= 0
                  || !Number.isSafeInteger(value.asset_id) || value.asset_id <= 0) return false;
              const allowed = ['github.com', 'release-assets.githubusercontent.com', 'objects.githubusercontent.com'];
              return typeof value.url === 'string' && /^https:\/\/github\.com\/scitex-ai\/(scitex-dev|scitex-container)\/releases\/download\/[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+\.sif$/.test(value.url)
                && Array.isArray(value.redirect_hosts) && value.redirect_hosts.length > 0
                && new Set(value.redirect_hosts).size === value.redirect_hosts.length
                && value.redirect_hosts.every(host => allowed.includes(host));
            }
            function qualifyImage(value, hosted, kind = 'ci') {
              requireContract(exactKeys(value, ['sha256', 'bytes', 'producer_revision',
                'source_manifest_sha256', 'public_inventory_sha256', 'delivery', 'capabilities', 'native_paths']), 'image-unqualified');
              requireContract(digest(value.sha256) && Number.isSafeInteger(value.bytes)
                && value.bytes > 0 && value.bytes <= 32 * 1024 ** 3, 'image-byte-pin-invalid');
              requireContract(typeof value.producer_revision === 'string'
                && /^[a-f0-9]{40}$/.test(value.producer_revision)
                && digest(value.source_manifest_sha256) && digest(value.public_inventory_sha256), 'image-producer-unqualified');
              const keys = kind === 'pg' ? ['postgres'] : kind === 'browser'
              ? ['3.11', '3.12', '3.13', 'postgres', 'chromium', 'playwright']
              : ['3.11', '3.12', '3.13', 'postgres'];
              requireContract(exactKeys(value.capabilities, keys)
                && keys.every(key => typeof value.capabilities[key] === 'string'), 'image-capabilities-unqualified');
              requireContract(value.delivery === null || publicDelivery(value.delivery), 'image-delivery-invalid');
              requireContract(Array.isArray(value.native_paths) && value.native_paths.length > 0
                && new Set(value.native_paths).size === value.native_paths.length
                && value.native_paths.every(path => typeof path === 'string'
                  && /^\/[A-Za-z0-9_./-]+\.sif$/.test(path)
                  && !path.split('/').includes('..') && !path.includes('//')), 'native-image-authority-unqualified');
              requireContract(!hosted || publicDelivery(value.delivery), 'hosted-image-delivery-unqualified');
              return value;
            }
            function qualifyRuntime(value, hosted) {
              requireContract(exactKeys(value, ['path', 'sha256', 'bytes', 'qualification_sha256',
                'user_namespace', 'sif_mount', 'hosted_delivery_sha256']), 'runtime-unqualified');
              requireContract(typeof value.path === 'string' && /^\/[A-Za-z0-9_./-]+$/.test(value.path)
                && !value.path.split('/').includes('..') && digest(value.sha256)
                && Number.isSafeInteger(value.bytes) && value.bytes > 0
                && digest(value.qualification_sha256) && value.user_namespace === true
                && value.sif_mount === true, 'runtime-capability-unqualified');
              requireContract(value.hosted_delivery_sha256 === null || digest(value.hosted_delivery_sha256), 'runtime-delivery-invalid');
              requireContract(!hosted || digest(value.hosted_delivery_sha256), 'hosted-runtime-delivery-unqualified');
              return value;
            }

            function registeredReleasePlan(profile, repository, eventName, native, operation, sourceCommit, releaseTag, registration, leafSources) {
              const repositories = {writer: 'scitex-ai/scitex-writer', io: 'scitex-ai/scitex-io', scholar: 'scitex-ai/scitex-scholar', browser: 'scitex-ai/scitex-browser'};
              requireContract(Object.hasOwn(repositories, profile), 'release-profile-refused');
              requireContract(repository === repositories[profile], profile + '-repository-refused');
              requireContract(['push', 'workflow_dispatch'].includes(eventName), profile + '-release-event-refused');
              requireContract(native === true, profile + '-release-membership-required');
              requireContract(['test', 'build'].includes(operation), profile + '-release-operation-refused');
              requireContract(typeof sourceCommit === 'string' && sourceCommit.length === 40
                && /^[a-f0-9]{40}$/.test(sourceCommit), profile + '-source-commit-refused');
              requireContract(typeof releaseTag === 'string' && releaseTag === releaseTag.trim()
                && /^v[0-9]+\.[0-9]+\.[0-9]+$/.test(releaseTag), profile + '-release-tag-refused');
              requireContract(exactKeys(registration, ['image', 'runtime']), profile + '-runtime-unregistered');
              const image = qualifyImage(registration.image, false, profile === 'browser' ? 'browser' : 'ci');
              const versions = operation === 'test' ? ['3.11', '3.12', '3.13'] : ['3.12'];
              for (const version of versions) {
                requireContract(image.capabilities[version].startsWith(version + '.'), profile + '-image-python-unqualified');
              }
              const runtime = qualifyRuntime(registration.runtime, false);
              const sourceNames = profile === 'writer'
                ? ['.github/ci/exec-in-sif.sh', '.github/ci/run-in-sif.sh',
                   '.github/ci/with-test-postgres.py', '.github/ci/writer_ci_postgres.py',
                   '.github/ci/build-in-sif.sh', '.github/ci/publish-in-sif.sh',
                   '.github/ci/release-identity.py']
                : profile === 'io' ? ['.github/ci/exec-in-sif.sh', '.github/ci/release-context.sh',
                   '.github/ci/run-in-sif.sh', '.github/ci/build-in-sif.sh',
                   '.github/ci/publish-in-sif.sh', '.github/ci/release-identity.py',
                   '.github/ci/_release_artifacts.py', '.github/ci/_release_source.py',
                   '.github/ci/probe-first-observer.py', '.github/ci/io_test_store.py']
                : profile === 'browser' ? [
                  ".github/ci/build-in-sif.sh",
                  ".github/ci/ci-browser.def",
                  ".github/ci/exec-in-sif.sh",
                  ".github/ci/probe-interactions.py",
                  ".github/ci/probe-wheel-in-sif.sh",
                  ".github/ci/publish-in-sif.sh",
                  ".github/ci/release-identity.py",
                  ".github/ci/release-source.py",
                  ".github/ci/run-in-sif.sh",
                  ".github/ci/verify-release-in-sif.sh"
                ]
                : ['.github/ci/exec-in-sif.sh', '.github/ci/release-context.sh',
                   '.github/ci/run-in-sif.sh', '.github/ci/build-in-sif.sh',
                   '.github/ci/release-identity.py', '.github/ci/with-test-postgres.py',
                   '.github/ci/probe-first-observer.py', '.github/ci/setup-node-owned.sh'];
              requireContract(exactKeys(leafSources, sourceNames)
                && sourceNames.every(path => digest(leafSources[path])), profile + '-source-closure-unregistered');

              return {profile, operation, sourceCommit, releaseTag, versions, image,
                runtime, leafSources, pgImage: null, native: true};
            }
            const IO_PYTEST_WORKERS = 4;
            // Whole IO profile qualified on compute-03; compute-04 failures
            // remain unqualified. This is release admission, not library support.
            const IO_RUNNER = Object.freeze({group: 'Organization', labels: Object.freeze([
              'self-hosted', 'Linux', 'X64', 'scitex-org-cpu', 'scitex-compute-03'
            ])});
            const IO_REGISTRATION = {
              "image": CI_CPU_E846,
              "runtime": {...APPTAINER_7BDB, qualification_sha256: "6a178f0d27be734a74df28f5d392f3f54e2bb4b6b2c2aced560ba6b091d08cec"}
            };
            const IO_LEAF_SOURCES = Object.freeze({
              ".github/ci/exec-in-sif.sh": "698e91c18b7c9c6b0631aa8ce9a62c6b681ad8f40e515925ac640efc4e4acfc9",
              ".github/ci/release-context.sh": "130f42eb7efbb511b0bcea962a84468e818e14ec3cf7498c2c45b9d145c430cc",
              ".github/ci/run-in-sif.sh": "cc406adce05d14b920df78fc59789c6eb7ddf590d4573c7c88b58d59f45e006f",
              ".github/ci/build-in-sif.sh": "226ffa167e746a24fc259f50e01181ea19fc1f234e2ad19bcdcd49eca17fd0de",
              ".github/ci/publish-in-sif.sh": "a724de1c4019535e4248c771cfcd6c9382d0cfafff9da7732e17c3560e6cbcf0",
              ".github/ci/release-identity.py": "997d87ea46f452684eae9fe2d5bc3f4cfda5371cce3c7f6c11efa3b15ee2ec4f",
              ".github/ci/_release_artifacts.py": "2d83d570507ac055124b9bf4116a55ca81c86221c5bb7f4efbfb9be951e13ed6",
              ".github/ci/_release_source.py": "fe6db73431025dcbd3ae45fa2f1de309fd2e90f257780da86458ae5b3c687cee",
              ".github/ci/probe-first-observer.py": "5759229d222d6492f211d47c56c723181e28c5d16fdefebe3914a5bfe305a98f",
              ".github/ci/io_test_store.py": "e1be5f3cfa849d4a8802b6a10b890731ca51be869330040cbbfd2c756f447a4d"
            });
            function writerPlan(repository, eventName, native, operation, sourceCommit, releaseTag, registration = REGISTRATION) {
              return registeredReleasePlan('writer', repository, eventName, native, operation,
                sourceCommit, releaseTag, registration, LEAF_SOURCES);
            }
            function ioPlan(repository, eventName, native, operation, sourceCommit, releaseTag, registration = IO_REGISTRATION) {
              const plan = registeredReleasePlan('io', repository, eventName, native, operation,
                sourceCommit, releaseTag, registration, IO_LEAF_SOURCES);
              return {...plan, pytestWorkers: IO_PYTEST_WORKERS, runner: IO_RUNNER};
            }
            // Qualified on compute-03: all three full suites and a separate fresh
            // same-source build. Other hosts remain outside this registration.
            const SCHOLAR_RUNNER = Object.freeze({group: 'Organization', labels: Object.freeze([
              'self-hosted', 'Linux', 'X64', 'scitex-org-cpu', 'scitex-compute-03'
            ])});
            const SCHOLAR_REGISTRATION = Object.freeze({
              "image": CI_CPU_E846,
              "runtime": {...APPTAINER_7BDB, qualification_sha256: "3b842983d34ba0b354836048cdf49b899583f871567ad78ebc1968f04ffaf786"}
            });
            const SCHOLAR_LEAF_SOURCES = Object.freeze({
              ".github/ci/exec-in-sif.sh": "9be3e2a4645e95cf073f59d93dc03e2f5c03e377cfd049b8548862e7ac881b3a",
              ".github/ci/release-context.sh": "130f42eb7efbb511b0bcea962a84468e818e14ec3cf7498c2c45b9d145c430cc",
              ".github/ci/run-in-sif.sh": "ed4d90fa668c609e382a6050ca57b15ada47a4707ffb758084044d840604222f",
              ".github/ci/build-in-sif.sh": "8909563f08cc6727b33fcec9e82bc51fb4cc810539e4317453073101706ed58d",
              ".github/ci/release-identity.py": "f16b0c95d4d912257dcd914874bf557a56063a00e1b755d9c883868affbab277",
              ".github/ci/with-test-postgres.py": "61e6e0488fe5e4fab53f5dae40313eae0e740c9890e438101007797397b340c5",
              ".github/ci/probe-first-observer.py": "952ba02e30b0794e01f6385a2cd8565498bdd481ebcdf5bdcea3803218c299ed",
              ".github/ci/setup-node-owned.sh": "053fdbf23b2e166a384894afa0e3d0a9c04f81722eb0077b7cda239dcb2b6698"
            });
            function scholarPlan(repository, eventName, native, operation, sourceCommit, releaseTag, registration = SCHOLAR_REGISTRATION) {
              const plan = registeredReleasePlan('scholar', repository, eventName, native, operation,
                sourceCommit, releaseTag, registration, SCHOLAR_LEAF_SOURCES);
              return {...plan, pytestWorkers: 4, runner: SCHOLAR_RUNNER};
            }
            const BROWSER_IMAGE = Object.freeze({
              "sha256": "7ad96b28e3485528fe13d8bbac6b7c514219d755361e99a7d13022e888e953c0",
              "bytes": 1891598336,
              "producer_revision": "fefce61f9cfc706258047cfb96bfe43ba94ffcaf",
              "source_manifest_sha256": "d5de213e255fd0de2cd59be34e8f7d45cb3f61de21511256601d5a86bb724314",
              "public_inventory_sha256": "547534123d79deb4e46606d990b200311d3c88c34be94623ab71c8ee7d871a78",
              "delivery": null,
              "capabilities": {
                "3.11": "3.11.17",
                "3.12": "3.12.15",
                "3.13": "3.13.16",
                "postgres": "postgres.16.15",
                "chromium": "158.0.8127.18",
                "playwright": "1.65.1"
              },
              "native_paths": [
                "/home/ywatanabe/.scitex/dev/runtime/containers/ci-browser-sha256-7ad96b28e3485528fe13d8bbac6b7c514219d755361e99a7d13022e888e953c0.sif"
              ]
            });
            const BROWSER_REGISTRATION = Object.freeze({image: BROWSER_IMAGE, runtime: {...APPTAINER_7BDB, qualification_sha256: "ad0bf6a6b3dd8ddc96194f0f67642199cc25e97bb2d7077717c73bfbbe9779bd"}});
            const BROWSER_LEAF_SOURCES = Object.freeze({
              ".github/ci/build-in-sif.sh": "fb3fd2b1b1cc62b36f56a867abe8f1093b446090c90b358894660cd5399082b5",
              ".github/ci/ci-browser.def": "8124dc13216d229842990d19da4e2b0a255be6527ddfa04e1cee6720d06f33e6",
              ".github/ci/exec-in-sif.sh": "0cd9a39968a414d56479a03761314ef2e808d444985ba7a5486564128fb8cbfc",
              ".github/ci/probe-interactions.py": "d1b3a11a0ae7838748710b875b4dfc4001473d4ef39579b927bf54f706e08117",
              ".github/ci/probe-wheel-in-sif.sh": "f4a3797fab9f16a5eee73feeffe99c8992d6b3af07ae3f331e04acad85a78260",
              ".github/ci/publish-in-sif.sh": "e89aebbff100e0bec6cf59905614b11ab948aaf426f39f35a2846bb8c2d76e13",
              ".github/ci/release-identity.py": "fd554650d99281a4f18f96edb8fd2758779fed82590f8e6a60f15407e5fada30",
              ".github/ci/release-source.py": "83691adbfeeec4bec3a736d58c61b357d366806447c19b0e6c8268b597707bbd",
              ".github/ci/run-in-sif.sh": "4dff72e9bc2e54842566d9569a4f7cb7b69005627275658b31a701ee9ef1b8c3",
              ".github/ci/verify-release-in-sif.sh": "e67649a5bb00223c6423d8f098cda7f554dfa5346549ad24d4ba0b280ea8bbd6"
            });
            const BROWSER_RUNNER = Object.freeze({group: 'Organization', labels: Object.freeze([
              'self-hosted', 'Linux', 'X64', 'scitex-org-cpu', 'scitex-compute-03'
            ])});
            function browserPlan(repository, eventName, native, operation, sourceCommit, releaseTag, registration = BROWSER_REGISTRATION) {
              const plan = registeredReleasePlan('browser', repository, eventName, native, operation,
                sourceCommit, releaseTag, registration, BROWSER_LEAF_SOURCES);
              return {...plan, runner: BROWSER_RUNNER};
            }
            function leafReleasePlan(repository, ...args) {
              if (repository === 'scitex-ai/scitex-writer') return writerPlan(repository, ...args);
              if (repository === 'scitex-ai/scitex-io') return ioPlan(repository, ...args);
              if (repository === 'scitex-ai/scitex-scholar') return scholarPlan(repository, ...args);
              if (repository === 'scitex-ai/scitex-browser') return browserPlan(repository, ...args);
              throw new Error('release-repository-refused');
            }
                        // END WRITER_RELEASE_CONTRACT
            const plan = leafReleasePlan(context.payload.repository.full_name, context.eventName,
              process.env.NATIVE_AUTHORIZED === 'true', process.env.OPERATION,
              process.env.SOURCE_COMMIT, process.env.RELEASE_TAG);
            core.setOutput('plan', JSON.stringify(plan));
            core.setOutput('versions', JSON.stringify(plan.versions));

  native:
    needs: [runner-admission, profile]
    if: needs.runner-admission.outputs.native_authorized == 'true'
    name: ${{ fromJSON(needs.profile.outputs.plan).profile }}-${{ inputs.operation }}-py${{ matrix.python-version }}
    runs-on: >-
      ${{ fromJSON(needs.profile.outputs.plan).runner
          || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('{"group":"Organization","labels":["self-hosted","Linux","X64","scitex-org-cpu"]}') }}
    timeout-minutes: ${{ inputs.operation == 'build' && 30 || 60 }}
    strategy:
      # Each normal native profile creates a large fresh dependency environment.
      # Admit one version at a time; keep all versions and their original limits.
      # This bounds this invocation only, not other jobs on the shared host.
      max-parallel: 1
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.profile.outputs.versions) }}
    env:
      RELEASE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted SciTeX organization CPU pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1
      - name: Require confirmed organization membership before checkout
        env:
          AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
        run: test "$AUTHORIZED" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify resolved source commit
        env:
          EXPECTED: ${{ inputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Verify fixed leaf drivers, runtime and whole image
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: inputs
        env:
          PLAN: ${{ needs.profile.outputs.plan }}
          NATIVE_CI_SIF: ${{ fromJSON(needs.profile.outputs.plan).profile == 'browser' && fromJSON(needs.profile.outputs.plan).image.native_paths[0] || vars.SCITEX_CI_SIF }}
        with:
          script: |
            // BEGIN SIF_FILE_GATE
            const fs = require('fs');
            const fsp = fs.promises;
            const path = require('path');
            const crypto = require('crypto');
            const plan = JSON.parse(process.env.PLAN);
            const deadline = Date.now() + 15 * 60 * 1000;
            function check(value, reason) { if (!value) throw new Error(reason); }
            function timeFence() { check(Date.now() < deadline, 'image-acquisition-deadline'); }
            async function regularBytes(file, expected, expectedSize = null) {
              timeFence();
              const handle = await fsp.open(file, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW);
              try {
                const before = await handle.stat();
                check(before.isFile() && (expectedSize === null || before.size === expectedSize), 'file-metadata-mismatch');
                const hash = crypto.createHash('sha256');
                const chunk = Buffer.alloc(1024 * 1024);
                let count = 0;
                while (true) {
                  timeFence();
                  const {bytesRead} = await handle.read(chunk, 0, chunk.length, null);
                  if (!bytesRead) break;
                  count += bytesRead;
                  check(count <= before.size, 'file-size-changed');
                  hash.update(chunk.subarray(0, bytesRead));
                }
                const after = await handle.stat();
                const current = await fsp.lstat(file);
                timeFence();
                check(after.dev === before.dev && after.ino === before.ino && after.size === before.size
                  && after.mtimeMs === before.mtimeMs && after.ctimeMs === before.ctimeMs
                  && current.dev === before.dev && current.ino === before.ino
                  && count === before.size && hash.digest('hex') === expected, 'file-byte-pin-mismatch');
              } finally { await handle.close(); }
            }
            const workspace = path.resolve(process.env.GITHUB_WORKSPACE);
            for (const [relative, digest] of Object.entries(plan.leafSources)) {
              let current = workspace;
              check((await fsp.lstat(current)).isDirectory(), 'source-root-invalid');
              const parts = relative.split('/');
              for (const part of parts.slice(0, -1)) {
                current = path.join(current, part);
                const value = await fsp.lstat(current);
                check(value.isDirectory() && !value.isSymbolicLink(), 'source-parent-not-owned');
              }
              await regularBytes(path.join(workspace, relative), digest);
            }
            await regularBytes(plan.runtime.path, plan.runtime.sha256, plan.runtime.bytes);
            let owned = null;
            if (!plan.native) {
              const base = path.resolve(process.env.RUNNER_TEMP);
              check((await fsp.lstat(base)).isDirectory(), 'runner-scratch-invalid');
              owned = await fsp.mkdtemp(path.join(base, 'scitex-sif-'));
              await fsp.chmod(owned, 0o700);
              const value = await fsp.lstat(owned);
              core.setOutput('owned', JSON.stringify({root: owned, dev: value.dev, ino: value.ino, uid: value.uid}));
            }
            async function acquire(image, locator, name) {
              if (plan.native) {
                check(typeof locator === 'string' && path.isAbsolute(locator)
                  && image.native_paths.includes(locator), 'native-image-locator-unapproved');
                const actual = await fsp.realpath(locator);
                await regularBytes(actual, image.sha256, image.bytes);
                return actual;
              }
              const target = path.join(owned, name);
              const output = await fsp.open(target, 'wx', 0o600);
              try {
                let location = image.delivery.url;
                let response;
                for (let redirects = 0; redirects <= 5; redirects++) {
                  const url = new URL(location);
                  check(url.protocol === 'https:' && !url.username && !url.password
                    && image.delivery.redirect_hosts.includes(url.hostname), 'public-image-redirect-refused');
                  response = await fetch(url.href, {
                    redirect: 'manual', signal: AbortSignal.timeout(Math.max(1, deadline - Date.now())),
                  });
                  if (![301, 302, 303, 307, 308].includes(response.status)) break;
                  const next = response.headers.get('location');
                  check(next && redirects < 5, 'public-image-redirect-refused');
                  location = new URL(next, url).href;
                }
                check(response.ok && response.body, 'public-image-download-refused');
                let count = 0;
                for await (const chunk of response.body) {
                  timeFence();
                  count += chunk.length;
                  check(count <= image.bytes, 'public-image-size-exceeded');
                  let offset = 0;
                  while (offset < chunk.length) {
                    timeFence();
                    const {bytesWritten} = await output.write(chunk, offset, chunk.length - offset, null);
                    timeFence();
                    check(Number.isSafeInteger(bytesWritten) && bytesWritten > 0
                      && bytesWritten <= chunk.length - offset, 'public-image-write-stalled');
                    offset += bytesWritten;
                  }
                }
                check(count === image.bytes, 'public-image-size-mismatch');
                await output.sync();
              } finally { await output.close(); }
              await regularBytes(target, image.sha256, image.bytes);
              await fsp.chmod(target, 0o400);
              return target;
            }
            core.setOutput('sif', await acquire(plan.image, process.env.NATIVE_CI_SIF, 'ci.sif'));
            core.setOutput('pg_sif', plan.pgImage
              ? await acquire(plan.pgImage, process.env.NATIVE_PG_SIF, 'pg.sif') : '');
            timeFence();
            core.setOutput('apptainer', plan.runtime.path);
            // END SIF_FILE_GATE
      - name: Run the registered complete leaf suite
        if: inputs.operation == 'test'
        env:
          CI_XDIST_WORKERS: ${{ fromJSON(needs.profile.outputs.plan).pytestWorkers || '' }}
          SCITEX_CI_SIF: ${{ steps.inputs.outputs.sif }}
          SCITEX_CI_SIF_SHA256: ${{ fromJSON(needs.profile.outputs.plan).image.sha256 }}
          SCITEX_CI_APPTAINER: ${{ steps.inputs.outputs.apptainer }}
          SCITEX_CI_APPTAINER_SHA256: ${{ fromJSON(needs.profile.outputs.plan).runtime.sha256 }}
        run: bash .github/ci/exec-in-sif.sh run-in-sif.sh ${{ matrix.python-version }}
      - name: Build and verify the retained whole wheel and sdist
        if: inputs.operation == 'build'
        env:
          CI_XDIST_WORKERS: ${{ fromJSON(needs.profile.outputs.plan).pytestWorkers || '' }}
          SCITEX_CI_SIF: ${{ steps.inputs.outputs.sif }}
          SCITEX_CI_SIF_SHA256: ${{ fromJSON(needs.profile.outputs.plan).image.sha256 }}
          SCITEX_CI_APPTAINER: ${{ steps.inputs.outputs.apptainer }}
          SCITEX_CI_APPTAINER_SHA256: ${{ fromJSON(needs.profile.outputs.plan).runtime.sha256 }}
        run: bash .github/ci/exec-in-sif.sh build-in-sif.sh 3.12
      - name: Verify the installed Browser wheel with the image browser
        if: inputs.operation == 'build' && fromJSON(needs.profile.outputs.plan).profile == 'browser'
        env:
          SCITEX_CI_SIF: ${{ steps.inputs.outputs.sif }}
          SCITEX_CI_SIF_SHA256: ${{ fromJSON(needs.profile.outputs.plan).image.sha256 }}
          SCITEX_CI_APPTAINER: ${{ steps.inputs.outputs.apptainer }}
          SCITEX_BROWSER_RELEASE_SOURCE_SHA: ${{ inputs.source_commit }}
          SCITEX_BROWSER_RELEASE_VERSION: ${{ inputs.release_tag }}
        run: bash .github/ci/exec-in-sif.sh probe-wheel-in-sif.sh 3.12
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'build'
        with:
          name: ${{ fromJSON(needs.profile.outputs.plan).profile }}-dist-${{ inputs.source_commit }}
          path: dist/
          if-no-files-found: error
