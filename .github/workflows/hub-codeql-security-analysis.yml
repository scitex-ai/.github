name: hub-codeql-security-analysis
'on':
  workflow_call: null
permissions:
  actions: read
  contents: read
  security-events: write
  packages: read
jobs:
  runner-admission:
    uses: ./.github/workflows/runner-admission.yml
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'
  analyze:
    name: Analyze Code
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
      && fromJSON('["ubuntu-latest"]') || fromJSON(needs.runner-admission.outputs.runs_on) }}
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language:
        - python
        - javascript
    steps:
    - name: Refuse to run fork-authored code on self-hosted infrastructure
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && runner.environment
        == 'self-hosted'
      run: 'echo "::error::Fork-authored code is not run on self-hosted infrastructure."

        echo "Review with gh pr checkout; public contributors receive the complete hosted validation graph."

        exit 1

        '
    - name: Require confirmed organization membership on native runners
      if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
      run: 'echo "::error::Organization membership admission was not confirmed."

        exit 1

        '
    - name: Require the fixed Hub repository before checkout
      env:
        EXPECTED_REPOSITORY: scitex-ai/scitex-hub
      run: 'test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"

        '
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Node.js (JS/TS extractor requires it)
      if: matrix.language == 'javascript'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended
        packs: ${{ matrix.language == 'python' && 'scitex-ai/python-security-barriers' || '' }}
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: /language:${{matrix.language}}
    needs:
    - runner-admission
