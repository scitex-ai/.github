name: import-smoke

# REUSABLE WORKFLOW — org-level pilot (scitex-stats, 2026-07-10).
# Mechanically extracted from the `import-smoke` job in
# scitex-ai/scitex-stats `.github/workflows/ci.yml`. No inputs: the package
# name is auto-derived from `src/<pkg>` in the checkout, same as source.

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          Runner label set for this job, as a JSON ARRAY STRING (it is consumed
          by fromJSON). DEFAULTS TO GITHUB-HOSTED, because a default must FAIL
          SAFE. It defaulted to the Spartan pool until 2026-08-15, when all
          four `spartan-cpu` runners went offline and every caller that passes
          nothing -- which was every caller, since no shipped stub passes this
          input -- silently requested a label no online machine served: 57
          queued runs across ~30 repositories, while the repo-level CI_RUNS_ON
          variables set on 76 of 76 repos had no effect at all, because THIS
          input selects the runner and nothing was passing it. A hosted default
          degrades to SLOWER; a self-hosted default degrades to NEVER. Pass
          `runs_on` to prefer our own hardware -- Spartan stays PREFERRED where
          it is faster (operator, 2026-08-13); this line only decides what
          happens when a caller is silent.
          MUST be a JSON string, not a YAML list: a YAML list decodes to
          something fromJSON rejects, and the resulting label mismatch makes
          the job QUEUE FOREVER rather than fail, which is indistinguishable
          from "still waiting" in the run list.
        type: string
        required: false
        default: '["ubuntu-latest"]'
      console_script:
        description: >-
          Name of a [project.scripts] console script to assert resolves, e.g.
          "sac". When set, the job additionally runs `.venv/bin/<name>
          --version`.

          WHY THIS IS WORTH A STEP OF ITS OWN. `import <pkg>` and "the console
          script resolves" are DIFFERENT failures. Entry-point drift — a
          renamed module or callable behind [project.scripts] — leaves the
          import passing and breaks every caller that invokes the command,
          which for containerised packages is the shape the runtime actually
          uses. Nothing else in CI exercises it against a venv install.

          A venv install DOES materialise entry-point scripts in .venv/bin,
          unlike `pip install --target`, which does not — so this assertion is
          meaningful here specifically.

          Left empty by default so packages that ship no console script are
          unaffected and nothing is asserted about them.
        type: string
        required: false
        default: ''
      uv_version:
        description: >-
          uv version for setup-uv, e.g. "0.11.29". Defaults to "latest", which
          is setup-uv's own default, so a caller that passes nothing keeps
          exactly the behaviour it has today.

          WHY A CALLER WOULD PIN. An unpinned `latest` makes a CI result a
          function of WALL-CLOCK TIME and of each runner's cache state: the
          same commit passes on one node and fails on another, and a run that
          was green yesterday goes red overnight with no diff. That is the
          worst failure shape a gate can have, because the evidence points at
          the change under test rather than at the toolchain underneath it.
          scitex-agent-container hit this and pinned deliberately
          (sac-ci-pin-uv-version-*).

          WHY IT IS AN INPUT RATHER THAN A PIN HERE. Pinning centrally would
          freeze uv for all 17+ consumers at once and make every bump a
          coordinated migration; leaving it unpinned forces any repo that
          needs determinism to keep a LOCAL COPY of this whole workflow, which
          is the PS-231 duplication this file exists to remove. An input lets
          one repo pin without touching the others — the same shape as
          `runs_on`.

          NOTE THIS DOES NOT PIN THE ACTION. `astral-sh/setup-uv@v7` above is
          the action version; this input is the uv BINARY it installs. Both can
          drift and only one of them is addressed here.
        type: string
        required: false
        default: 'latest'

jobs:
  import-smoke:
    name: import-smoke-on-ubuntu-py3-12
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 15
    steps:
      # FORK GUARD — MUST BE THE FIRST STEP, AHEAD OF actions/checkout, which is
      # what first puts fork-authored content on the node. Rationale, the two
      # operator mandates it reconciles, and what it deliberately does NOT stop:
      # README.md "Fork guard". Ordering and predicate are asserted in
      # tests/test_fork_guard.py — do not reorder, do not reword the `if`.
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted Spartan pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          # Defaults to "latest", which is setup-uv's own default, so every
          # caller that passes nothing keeps exactly today's behaviour. See
          # the `uv_version` input for why a caller would want to pin.
          version: ${{ inputs.uv_version }}
          cache-dependency-glob: pyproject.toml
      - name: Install (no extras) + import
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e .
          PKG=$(basename "$(find src -maxdepth 1 -mindepth 1 -type d ! -name '*.egg-info' | sort | head -1)")
          .venv/bin/python -c "import importlib; importlib.import_module('$PKG'); print('import OK:', '$PKG')"

      # A SEPARATE STEP, NOT A LINE APPENDED ABOVE, so its failure is
      # attributable: "the package imports but its command is broken" and "the
      # package does not import" are different diagnoses and should not share
      # a red step.
      - name: Console script resolves (${{ inputs.console_script }} --version)
        if: inputs.console_script != ''
        run: |
          set -euo pipefail
          SCRIPT=".venv/bin/${{ inputs.console_script }}"
          # Check existence FIRST and say so plainly. Without this the failure
          # is a bare "No such file or directory" from the shell, which reads
          # as an infrastructure problem rather than as the [project.scripts]
          # drift it actually is.
          if [ ! -x "$SCRIPT" ]; then
            echo "::error title=Console script missing::[project.scripts] declares '${{ inputs.console_script }}' but $SCRIPT does not exist after an editable install. The entry point is declared and not installable — check the module:callable target in pyproject.toml."
            exit 1
          fi
          "$SCRIPT" --version
