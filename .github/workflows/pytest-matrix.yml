name: pytest-matrix

# REUSABLE WORKFLOW — org-level pilot (scitex-stats, 2026-07-10).
# Mechanically extracted from the `pytest-matrix` job in
# scitex-ai/scitex-stats `.github/workflows/ci.yml`. No inputs: the package
# name is auto-derived from `src/<pkg>` in the checkout (same as the
# original), and the python-version matrix / runner label are identical
# across every caller today, so nothing needs to be parameterized yet.
# CODECOV_TOKEN is now DECLARED under `workflow_call.secrets` below, so a caller
# maps it explicitly. This line used to read "CODECOV_TOKEN must be available to
# the caller (secrets: inherit)" — that advice is WITHDRAWN. `inherit` forwards
# EVERY secret the calling repo holds into these jobs; measured 2026-08-03,
# scitex-ui and scitex-hpc each hold CLAUDE_CODE_CREDENTIALS_JSON (the fleet
# Claude credential), which nothing here touches. PS-224 flags the pattern.
#
# CALLERS MUST USE THE JOB ID `pytest-matrix`. Copy the stub from
# workflow-templates/pytest-matrix.yml; do not write your own. The check name
# GitHub renders is "<caller job id> / <this job's name>", so the caller's job id
# IS the branch-protection context prefix: name it anything else and that repo
# emits a check name no other repo emits, which means a bespoke required-check
# list for it forever. See the README's "Caller job ids" section.

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          JSON array of runner labels. DEFAULTS TO THE SPARTAN POOL, which is
          exactly what every caller got before this input existed — adding it
          changes no repo that does not pass it.

          Pass '["ubuntu-latest"]' to run on GitHub-hosted runners. Operator
          ruling 2026-07-31: hosted is the DEFAULT CHOICE for new work, because
          most scitex repositories are public so hosted minutes are free;
          self-hosted is for jobs where our own machines are genuinely faster
          (long builds, GPU, large data), not a blanket policy.

          The concrete reason a caller opts out today is the shared tool cache.
          Every runner on the Spartan lease inherits one mutable
          ~/.runner-toolcache on GPFS, so runners contend for one directory and
          jobs fail BOTH reading it (`uv: No such file` -> exit 127) and
          writing it (ENOENT during copy). Measured on scitex-cards
          2026-07-31: seven failures across five pull requests in one
          afternoon, four differently-named runners, every one cleared by a
          plain rerun. The tell is DURATION — failures finish in 14-30s where
          passing legs take 62-66s. Until each runner gets its own
          AGENT_TOOLSDIRECTORY (see #24, which notes the per-runner fix
          "cannot fire"), a caller that cannot absorb random reruns should pass
          ubuntu-latest.
        type: string
        required: false
        default: '["self-hosted","Linux","X64","spartan-cpu"]'

    # Declared so a caller can pass this ONE secret explicitly instead of
    # `secrets: inherit`, which forwards EVERY secret the calling repo holds
    # into these jobs. Same remedy PR #22 already shipped for cla.yml.
    #
    # `required: false`, NOT true, and the distinction is load-bearing:
    # measured 2026-08-03 across all 50 consumer repos, exactly ONE
    # (scitex-io) holds a CODECOV_TOKEN. Marking it required would break the
    # other 49 the moment they stop inheriting.
    #
    # WHAT THIS DOES NOT FIX, stated so nobody reads the declaration as a
    # repair: the coverage upload is ALREADY failing silently wherever the
    # token is absent. Measured in scitex-ui run 30803831246 and scitex-hpc
    # run 30793784485 — `Token required because branch is protected`, then
    # `conclusion=success` one line later, because `fail_ci_if_error: false`
    # turns the rejection into a log line inside a green leg. That is a failed
    # STEP inside a passing JOB, so neither per-leg check state nor
    # `run_attempt` can see it. Making the absence loud is a separate change
    # and must come AFTER callers have had the chance to map the secret —
    # flipping it now would turn 49 repos red before any of them could comply.
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  pytest-matrix:
    # This name is the SECOND half of the required status check. The full context
    # a caller emits is "pytest-matrix / pytest-matrix-on-ubuntu-py3.11" (given the
    # mandated caller job id above). Renaming this breaks branch protection in
    # every repo at once — reconcile protection in the same change if you ever do.
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # FORK GUARD — MUST BE THE FIRST STEP, AHEAD OF actions/checkout, which is
      # what first puts fork-authored content on the node. Rationale, the two
      # operator mandates it reconciles, and what it deliberately does NOT stop:
      # README.md "Fork guard". Ordering and predicate are asserted in
      # tests/test_fork_guard.py — do not reorder, do not reword the `if`.
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted Spartan pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml
          # PINNED, and the pin is load-bearing — see the RUNNER_TOOL_CACHE note
          # below for the hazard it defuses.
          #
          # Unpinned, this resolves to `latest`. The moment astral publishes a
          # release, EVERY concurrent job becomes a tool-cache MISS at the same
          # instant, and a miss is the only thing that calls the destructive
          # writer (_createToolPath rmRF's <ver>/<arch> before refilling it).
          # That is the trigger for the whole failure described below. On a HIT
          # the action only calls find() + addPath and writes nothing, so no job
          # can destroy a tree another is reading.
          #
          # This does NOT make the shared cache safe — it removes the event that
          # sets it off. The hazard itself (~80 runners sharing one mutable
          # directory) is fixed by giving each runner its own
          # AGENT_TOOLSDIRECTORY in the runner supervisor, which is the only
          # place it CAN be fixed; see below. Keep both.
          #
          # Bumping this pin re-opens the window for one run, so warm the new
          # version on the pool before bumping, or bump when the pool is idle.
          #
          # Independently correct regardless of the race: an unpinned toolchain
          # silently changes what CI runs whenever an upstream release lands,
          # which is the opposite of a reproducible build.
          version: "0.12.0"
        env:
          # PER-RUNNER TOOL CACHE. Every runner on the Spartan lease inherited
          # RUNNER_TOOL_CACHE=~/.runner-toolcache from the supervisor, so ~80
          # runners shared ONE mutable cache on GPFS. @actions/tool-cache's
          # writer is destructive, not additive:
          #
          #   _createToolPath():  rmRF(<ver>/<arch>)      <- deletes the tree
          #                       rmRF(<ver>/<arch>.complete)
          #                       mkdirP(<ver>/<arch>)
          #   ...copy files in...
          #   _completeToolPath(): write <arch>.complete
          #
          # and the reader, find(), treats dir + `.complete` as a HIT and puts
          # it on PATH WITHOUT checking that the binary is inside. So when a new
          # uv release makes every concurrent job a cache MISS at once, each one
          # deletes the tree the others are using or filling. Two observed faces,
          # same cause:
          #   ENOENT copying into the toolcache  (two writers collide)
          #   "Added .../uv/<ver>/x86_64 to the path" then
          #   ".../uv: No such file or directory" -> exit 127
          #     (a reader's hit gets deleted under it — figrecipe main, run
          #      29945387939, 2026-07-22: all three matrix legs, three runners)
          #
          # Scoping the cache per runner removes the sharing, so no job can
          # destroy another's tree. This is why PRE-SEEDING the image does NOT
          # fix it: _createToolPath rmRF's a pre-seeded tree exactly the same.
          #
          # /tmp is node-local and may be cleared: that degrades to a cache MISS
          # (re-download, slower), never a dangling path — mkdirP recreates it.
          # Deliberately NOT on GPFS: punim0264 is at 98.2% of its 8M inode
          # limit and a per-runner cache there would multiply inode use by ~80.
          #
          # Set at STEP level on purpose: the `runner` context is not available
          # to job-level `env`. setup-uv writes the resolved path to $GITHUB_PATH,
          # so later steps resolve uv without needing this variable themselves.
          RUNNER_TOOL_CACHE: /tmp/scitex-ci-runner-work/toolcache/${{ runner.name }}
      - name: Install (.[all,dev]) + pytest
        run: |
          set -euo pipefail
          # --seed puts pip/setuptools/wheel IN the venv. A bare `uv venv`
          # ships none of them, so any test that shells out to
          # `sys.executable -m pip ...` gets "No module named pip". That is
          # a regression against the per-repo workflows this reusable
          # replaced: they all built the env with actions/setup-python +
          # `pip install`, so pip was always present.
          # Caught by scitex-hub PR #433 — its pip-install e2e gate proves
          # the production `pip_install_user_app` argv shape and went red
          # on exactly this.
          uv venv --seed --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e ".[all,dev]" \
            || uv pip install --python .venv/bin/python -e ".[dev]" \
            || uv pip install --python .venv/bin/python -e .
          # pytest-xdist is installed EXPLICITLY, not relied on transitively.
          # scitex-dev declares it, but only under its OWN [dev] extra — and a
          # package depending on plain `scitex-dev` does NOT get that extra, so
          # `-n` was silently unavailable in most repos. Installing it here makes
          # the flag below work for every caller regardless of its extras.
          uv pip install --python .venv/bin/python "pytest-xdist>=3.0.0"
          # kaleido/plotly image export needs Chrome; install best-effort (no-op for non-plotly repos)
          yes | .venv/bin/plotly_get_chrome >/dev/null 2>&1 || true
          # .venv/bin on PATH so console-scripts installed into the venv are
          # resolvable from inside the test process. Tests that gate on
          # `shutil.which("<tool>")` SKIP silently without this — they do not
          # fail, so the suite still reports green while the gate never ran.
          # Observed in scitex-hub: tests/develop/test_audit.py (the brand
          # quality gate) went from PASSED on the retired setup-python
          # workflow to SKIPPED here, because `scitex-dev` was installed in
          # .venv but not on PATH. quality-audit.yml already does this.
          export PATH="$PWD/.venv/bin:$PATH"
          PKG=$(basename "$(find src -maxdepth 1 -mindepth 1 -type d ! -name '*.egg-info' | sort | head -1)")
          # -n auto: the suite ran SINGLE-PROCESS on a multi-core Spartan lease,
          # so the runner's cores sat idle while wall-clock grew with the suite.
          # Operator ruling 2026-07-19: 「全てのレポジトリで xdist 並列です、
          # あたりまえですけど」.
          #
          # Measured on scitex-cards (3179 tests, contended 16-core box):
          #   single-process    8m39s
          #   -n auto (16 wk)   6m37s   and 0 failures — the suite is xdist-safe
          # The gap is far larger on a quiet dedicated runner: the same suite was
          # taking 17-21 min per leg here, and after a test-quality pass grew it
          # to 4462 tests the legs got slower still. That is what motivated this.
          #
          # IF YOUR SUITE IS NOT XDIST-SAFE (order-dependent, or sharing on-disk
          # state across tests) this surfaces as FAILURES here, not as silence.
          # Fix the shared state, or pin `-p no:xdist` in that repo's own pytest
          # config — do not drop the flag for every other repo.
          #
          # ...but `auto` ALONE OVERSUBSCRIBES ~2.7x on these runners. Measured on
          # spartan-bm155 inside a live 48-CPU lease cgroup (job_27144058/step_extern):
          #   os.sched_getaffinity(0)         -> 48   (the actual allocation)
          #   os.cpu_count()                  -> 128
          #   psutil.cpu_count(logical=False) -> 128  <- what `auto` resolves to
          # xdist's pytest_xdist_auto_num_workers consults psutil FIRST and returns
          # immediately (xdist/plugin.py 3.8.0); only if psutil is ABSENT does it fall
          # back to sched_getaffinity, which would have been correct. So `auto` is
          # right without psutil and wrong with it. Corroborated in scitex-hub CI:
          # worker ids reached gw121 on a 48-CPU lease.
          #
          # PYTEST_XDIST_AUTO_NUM_WORKERS is consulted AHEAD of psutil, so this
          # corrects `auto` without hardcoding a worker count.
          #
          # Do NOT key this on $SLURM_CPUS_PER_TASK / $SLURM_JOB_CPUS_PER_NODE: both
          # are EMPTY here. The runner is ssh-adopted into the lease cgroup, so it
          # inherits the cpuset but NOT the step environment. sched_getaffinity reads
          # the cpuset directly and is the only thing that works. (ADR-0004 P1(b)
          # prescribed the SLURM-var form and was wrong; corrected in scitex-dev.)
          export PYTEST_XDIST_AUTO_NUM_WORKERS="$(.venv/bin/python -c 'import os; print(len(os.sched_getaffinity(0)))')"
          .venv/bin/python -m pytest tests/ -n auto \
            --cov="src/$PKG" --cov-report=xml --cov-report=term
      - name: Seed the per-job git config for the codecov step
        if: always() && matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          # GIT_CONFIG_GLOBAL REPLACES the global config, it does not layer on
          # top of it. So the step below, which redirects writes away from the
          # shared ~/.gitconfig, ALSO hides user.name / user.email from git —
          # silently, because nothing in the codecov step reads them today.
          #
          # `include.path` restores reads while leaving writes redirected:
          # identity resolves through the real config, `--add safe.directory`
          # still lands in the throwaway file.
          #
          # Added prophylactically. codecov-action appears not to need identity,
          # and CI has been green since the redirect landed — but "appears not
          # to need" is an assumption nobody asserted, and scitex-hpc caught the
          # same shape in their launcher fix an hour before this was written,
          # where it WOULD have made every CI commit identity-less.
          #
          # This whole block is temporary. The launcher-level fix in the runner
          # supervisor sets GIT_CONFIG_GLOBAL once, for every runner and every
          # one of the ~58 per-repo callers this workflow never sees. When that
          # is deployed and live, revert this and the env: below together.
          printf '[include]\n\tpath = %s\n' "$HOME/.gitconfig" \
            > "${{ runner.temp }}/gitconfig-codecov"

      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          # PER-JOB GLOBAL GIT CONFIG. codecov-action runs `git config --global`
          # internally (its safe.directory / fork-detection preamble). Every
          # runner on the Spartan lease shares ONE $HOME, so two runners reaching
          # this step at the same moment contend for git's lockfile and the loser
          # dies before uploading anything:
          #
          #   error: could not lock config file /home/ywatanabe/.gitconfig: File exists
          #   ##[error]Process completed with exit code 255.
          #
          # Observed: scitex-ui PR #109, run 30398799453,
          # job pytest-matrix-on-ubuntu-py3.12, step __codecov_codecov-action.__run_3
          # (2026-07-28). Third sighting of the class in eleven days.
          #
          # SAME shared-$HOME class as the RUNNER_TOOL_CACHE fix above, different
          # resource. It is NOT random across the matrix: this step is gated to
          # py3.12, so the failure always lands on that one leg — which reads like
          # "3.12 is flaky" and invites a re-run instead of a look at the log. A
          # re-run does clear it, which is exactly why it survived three sightings.
          #
          # actions/checkout already solves this the same way: its post-job step
          # copies ~/.gitconfig aside and temporarily overrides HOME before
          # touching the global config. codecov-action does not, so redirect here.
          #
          # runner.temp is per-runner, and a runner executes one job at a time, so
          # this path is unique per concurrent job by construction. git creates the
          # file on first write and treats a missing one as empty — no seeding.
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-codecov
