name: immutable-sif-matrix

# Public delivery and retained private execution have separate authority.
# Unknown source/image/runtime closures remain failed profile gates. A private
# image is selected only after organization admission and is never downloaded
# by hosted or fork jobs.
on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: false
        default: matrix
      runs_on:
        type: string
        required: false
        default: '["ubuntu-latest"]'
      ci_xdist_workers:
        type: string
        required: false
        default: ''
      release_tag:
        type: string
        required: false
        default: ''
    outputs:
      release_plan:
        value: ${{ jobs.profile.outputs.plan }}
      release_tag:
        value: ${{ jobs.profile.outputs.tag }}
      source_commit:
        value: ${{ jobs.profile.outputs.commit }}
      artifact:
        value: ${{ jobs.build-dev-release.outputs.artifact }}
      manifest_sha256:
        value: ${{ jobs.build-dev-release.outputs.manifest_sha256 }}
      identity_sha256:
        value: ${{ jobs.profile.outputs.identity_sha256 }}
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  runner-admission:
    uses: ./.github/workflows/runner-admission.yml
    with:
      runs_on: ${{ inputs.suite == 'nightly' && '["ubuntu-latest"]' || inputs.runs_on }}

  profile:
    needs: [runner-admission]
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      plan: ${{ steps.contract.outputs.plan }}
      versions: ${{ steps.contract.outputs.versions }}
      profile: ${{ steps.contract.outputs.profile }}
      suite: ${{ steps.contract.outputs.suite }}
      tag: ${{ steps.contract.outputs.tag }}
      commit: ${{ steps.contract.outputs.commit }}
      identity_sha256: ${{ steps.contract.outputs.identity_sha256 }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: contract
        env:
          NATIVE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
          SIF_SUITE: ${{ inputs.suite }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            // BEGIN SIF_CONTRACT
            const PROFILES = Object.freeze({
              'scitex-ai/scitex-dev': {
                id: 'dev', pgKind: 'embedded', pgBin: '/usr/lib/postgresql/16/bin',
                pgVersion: '16.15', image: null, pgImage: null,
                // Retained private authority: actual nine node/minor probes
                // and whole bytes, receipt22362dd8. No public producer claim.
                nativeImage: {
                  authority_kind: 'retained-private-ci',
                  sha256: 'aa5836a6c317640d7e20f01eb79aa7385b3dca2f369b595065c50ba3dd34a7d5',
                  bytes: 1328443392,
                  qualification_sha256: '22362dd8da22aa93653613d899e9ab6232d3a099576d7da646ea617a35f2e036',
                  capabilities: {'3.11': '3.11.16', '3.12': '3.12.14', '3.13': '3.13.15', postgres: '16.15'},
                  native_paths: ['/home/ywatanabe/.scitex/dev/runtime/containers/ci-cpu-sha256-aa5836a6c317640d7e20f01eb79aa7385b3dca2f369b595065c50ba3dd34a7d5.sif'],
                },
                nativePgImage: null,
                nativeRuntime: {
                  path: '/usr/bin/apptainer',
                  sha256: '7bdb501fdddbb7264b4e4d6038e0ec27201f63e217519e5f7f0db950c9285ddd',
                  bytes: 48096048,
                  qualification_sha256: '22362dd8da22aa93653613d899e9ab6232d3a099576d7da646ea617a35f2e036',
                  user_namespace: true, sif_mount: true, hosted_delivery_sha256: null,
                },
                hostedRuntime: null,
                leafSources: {
                  '.github/ci/exec-in-sif.sh': 'dffc356c99c0deb8c031580ea667f6e4ea695dd1ce000d19a1a127442b8c9cf0',
                  '.github/ci/run-in-sif.sh': 'cc690aeca6770e980652f499d50571e0e2fc759abbf2b870c650fcc3dd493786',
                  '.github/ci/release-context.sh': 'd7433cacdd9098bdbe77994ba7a78d91b90edc7164a00a40450db19978ac57f8',
                  '.github/ci/verify-postgres-capability.py': 'af610a811b19f746c9a717fbebbc67639b16df962544acac9b51a3dd38a43455',
                },
                releaseSources: {
                  '.github/ci/build-in-sif.sh': '30961623dc2d790adaa43356ff236e5f5ace27f708caaf096d4019660c569c08',
                  '.github/ci/release-identity.py': '0c80f6631f00190ccb24833d95a800af3d979e69c720aa66bb2b5ae0c61f220a',
                  '.github/ci/publish-in-sif.sh': '8c1aee030d76b05f650dba88c9508e6241e8fa6c779df6df9aa3c629254dac02',
                },
              },
              'scitex-ai/scitex-agent-container': {
                id: 'sac', pgKind: 'separate', pgBin: null, pgVersion: '18',
                image: null, pgImage: null,
                // Same qualified Python image; PostgreSQL stays a separate
                // mandatory PG18 image. Neither is a public producer record.
                nativeImage: {
                  authority_kind: 'retained-private-ci',
                  sha256: 'aa5836a6c317640d7e20f01eb79aa7385b3dca2f369b595065c50ba3dd34a7d5',
                  bytes: 1328443392,
                  qualification_sha256: '22362dd8da22aa93653613d899e9ab6232d3a099576d7da646ea617a35f2e036',
                  capabilities: {'3.11': '3.11.16', '3.12': '3.12.14', '3.13': '3.13.15', postgres: '16.15'},
                  native_paths: ['/home/ywatanabe/.scitex/dev/runtime/containers/ci-cpu-sha256-aa5836a6c317640d7e20f01eb79aa7385b3dca2f369b595065c50ba3dd34a7d5.sif'],
                },
                nativePgImage: {
                  authority_kind: 'retained-private-ci',
                  sha256: '842a1fcf5abdc512af312c1527a0700c52e4b1a6b6e3e3dddc6edde69113ee23',
                  bytes: 157646848,
                  qualification_sha256: '75e24f6fa3a80369b45e8c3d1029d940076109c92404d0d82a168be74859771b',
                  capabilities: {postgres: '18.6'},
                  native_paths: ['/home/ywatanabe/.scitex/pg/runtime/postgres18-sha256-842a1fcf5abdc512af312c1527a0700c52e4b1a6b6e3e3dddc6edde69113ee23.sif'],
                },
                nativeRuntime: {
                  path: '/usr/bin/apptainer',
                  sha256: '7bdb501fdddbb7264b4e4d6038e0ec27201f63e217519e5f7f0db950c9285ddd',
                  bytes: 48096048,
                  qualification_sha256: '75e24f6fa3a80369b45e8c3d1029d940076109c92404d0d82a168be74859771b',
                  user_namespace: true, sif_mount: true, hosted_delivery_sha256: null,
                },
                hostedRuntime: null,
                leafSources: {
                  '.github/ci/exec-in-sif.sh': '3687d72d25fef989317e7db6dd96d2b344c0f51508e45c92fda59d0ed4c73951',
                  '.github/ci/run-in-sif.sh': '2950f281cfb12b5b879adf0b5bfa4bbcf66255dd1fd53fcfdbe5cecdfa2a7f6f',
                  '.github/ci/tmpdir-lib.sh': '3d3399ba4bbf33d236abad9a0a011bcd9ec14a3f6a7f6042f14e5877a57e3f89',
                  '.github/ci/clean-tmpdir.sh': '36421082132cf7b48564bce71470f7c2b0483cb72286ae2710f7e7dd62f3962a',
                  '.github/ci/sif-runtime-lib.sh': 'c5fd90926c5948e5ffbf32ab095a2c27b07c5c17a6efaefb2bb125d9846c01e5',
                },
              },
            });
            const LEAF_PATHS = Object.freeze({
              dev: ['.github/ci/exec-in-sif.sh', '.github/ci/run-in-sif.sh',
                    '.github/ci/release-context.sh', '.github/ci/verify-postgres-capability.py'],
              sac: ['.github/ci/exec-in-sif.sh', '.github/ci/run-in-sif.sh',
                    '.github/ci/tmpdir-lib.sh', '.github/ci/clean-tmpdir.sh',
                    '.github/ci/sif-runtime-lib.sh'],
            });
            function requireContract(value, reason) {
              if (!value) throw new Error(reason);
            }
            function exactKeys(value, names) {
              return value && typeof value === 'object' && !Array.isArray(value)
                && Object.keys(value).sort().join('|') === [...names].sort().join('|');
            }
            function digest(value) {
              return typeof value === 'string' && /^[a-f0-9]{64}$/.test(value);
            }
            function publicDelivery(value) {
              if (!exactKeys(value, ['url', 'release_id', 'asset_id', 'redirect_hosts'])) return false;
              if (!Number.isSafeInteger(value.release_id) || value.release_id <= 0
                  || !Number.isSafeInteger(value.asset_id) || value.asset_id <= 0) return false;
              const allowed = ['github.com', 'release-assets.githubusercontent.com', 'objects.githubusercontent.com'];
              return typeof value.url === 'string' && /^https:\/\/github\.com\/scitex-ai\/(scitex-dev|scitex-container)\/releases\/download\/[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+\.sif$/.test(value.url)
                && Array.isArray(value.redirect_hosts) && value.redirect_hosts.length > 0
                && new Set(value.redirect_hosts).size === value.redirect_hosts.length
                && value.redirect_hosts.every(host => allowed.includes(host));
            }
            function qualifyImage(value, hosted, kind = 'ci') {
              requireContract(exactKeys(value, ['sha256', 'bytes', 'producer_revision',
                'source_manifest_sha256', 'public_inventory_sha256', 'delivery', 'capabilities', 'native_paths']), 'image-unqualified');
              requireContract(digest(value.sha256) && Number.isSafeInteger(value.bytes)
                && value.bytes > 0 && value.bytes <= 32 * 1024 ** 3, 'image-byte-pin-invalid');
              requireContract(typeof value.producer_revision === 'string'
                && /^[a-f0-9]{40}$/.test(value.producer_revision)
                && digest(value.source_manifest_sha256) && digest(value.public_inventory_sha256), 'image-producer-unqualified');
              const keys = kind === 'pg' ? ['postgres'] : ['3.11', '3.12', '3.13', 'postgres'];
              requireContract(exactKeys(value.capabilities, keys)
                && keys.every(key => typeof value.capabilities[key] === 'string'), 'image-capabilities-unqualified');
              requireContract(value.delivery === null || publicDelivery(value.delivery), 'image-delivery-invalid');
              requireContract(Array.isArray(value.native_paths) && value.native_paths.length > 0
                && new Set(value.native_paths).size === value.native_paths.length
                && value.native_paths.every(path => typeof path === 'string'
                  && /^\/[A-Za-z0-9_./-]+\.sif$/.test(path)
                  && !path.split('/').includes('..') && !path.includes('//')), 'native-image-authority-unqualified');
              requireContract(!hosted || publicDelivery(value.delivery), 'hosted-image-delivery-unqualified');
              return value;
            }
            function qualifyRuntime(value, hosted) {
              requireContract(exactKeys(value, ['path', 'sha256', 'bytes', 'qualification_sha256',
                'user_namespace', 'sif_mount', 'hosted_delivery_sha256']), 'runtime-unqualified');
              requireContract(typeof value.path === 'string' && /^\/[A-Za-z0-9_./-]+$/.test(value.path)
                && !value.path.split('/').includes('..') && digest(value.sha256)
                && Number.isSafeInteger(value.bytes) && value.bytes > 0
                && digest(value.qualification_sha256) && value.user_namespace === true
                && value.sif_mount === true, 'runtime-capability-unqualified');
              requireContract(value.hosted_delivery_sha256 === null || digest(value.hosted_delivery_sha256), 'runtime-delivery-invalid');
              requireContract(!hosted || digest(value.hosted_delivery_sha256), 'hosted-runtime-delivery-unqualified');
              return value;
            }
            function qualifyRetainedPrivateImage(value, native, kind = 'ci') {
              requireContract(native === true, 'private-image-hosted-refused');
              requireContract(exactKeys(value, ['authority_kind', 'sha256', 'bytes',
                'qualification_sha256', 'capabilities', 'native_paths'])
                && value.authority_kind === 'retained-private-ci', 'private-image-authority-unqualified');
              requireContract(digest(value.sha256) && Number.isSafeInteger(value.bytes)
                && value.bytes > 0 && value.bytes <= 32 * 1024 ** 3
                && digest(value.qualification_sha256), 'private-image-byte-pin-invalid');
              const keys = kind === 'pg' ? ['postgres'] : ['3.11', '3.12', '3.13', 'postgres'];
              requireContract(exactKeys(value.capabilities, keys)
                && keys.every(key => typeof value.capabilities[key] === 'string'), 'private-image-capabilities-unqualified');
              requireContract(Array.isArray(value.native_paths) && value.native_paths.length > 0
                && new Set(value.native_paths).size === value.native_paths.length
                && value.native_paths.every(path => typeof path === 'string'
                  && /^\/[A-Za-z0-9_./-]+\.sif$/.test(path)
                  && !path.split('/').includes('..') && !path.includes('//')), 'private-image-locator-unqualified');
              return value;
            }
            function profileSelection(repository, eventName, suite = 'matrix') {
              requireContract(Object.hasOwn(PROFILES, repository), 'repository-unregistered');
              requireContract(['push', 'pull_request', 'schedule', 'workflow_dispatch'].includes(eventName), 'event-unsupported');
              requireContract(['matrix', 'nightly', 'dev-release'].includes(suite), 'suite-unsupported');
              const profile = PROFILES[repository];
              if (suite === 'dev-release') {
                requireContract(profile.id === 'dev', 'release-profile-unsupported');
                requireContract(['push', 'workflow_dispatch'].includes(eventName), 'release-event-unsupported');
              }
              if (suite === 'nightly') {
                requireContract(profile.id === 'sac', 'nightly-profile-unsupported');
                requireContract(['pull_request', 'schedule', 'workflow_dispatch'].includes(eventName), 'nightly-event-unsupported');
                return {profile: profile.id, suite, versions: ['3.12']};
              }
              const versions = profile.id === 'sac' && eventName === 'pull_request'
                ? ['3.11', '3.13'] : ['3.11', '3.12', '3.13'];
              return {profile: profile.id, suite, versions};
            }
            function planFor(repository, eventName, native, registry = PROFILES, suite = 'matrix') {
              const selected = profileSelection(repository, eventName, suite);
              requireContract(typeof native === 'boolean', 'admission-invalid');
              requireContract(selected.suite !== 'nightly' || !native, 'nightly-native-refused');
              const value = registry[repository];
              requireContract(value && value.id === selected.profile, 'profile-mismatch');
              const image = native && value.nativeImage
                ? qualifyRetainedPrivateImage(value.nativeImage, native)
                : qualifyImage(value.image, !native);
              for (const version of selected.versions) {
                requireContract(typeof image.capabilities[version] === 'string'
                  && image.capabilities[version].startsWith(version + '.'), 'image-python-unqualified');
              }
              let pgImage = null;
              if (value.id === 'dev') {
                requireContract(value.pgKind === 'embedded' && value.pgBin === '/usr/lib/postgresql/16/bin'
                  && value.pgVersion === '16.15' && image.capabilities.postgres === '16.15', 'dev-pg-capability-unqualified');
              } else {
                requireContract(value.pgKind === 'separate' && value.pgVersion === '18', 'sac-pg-architecture-invalid');
                pgImage = native && value.nativePgImage
                  ? qualifyRetainedPrivateImage(value.nativePgImage, native, 'pg')
                  : qualifyImage(value.pgImage, !native, 'pg');
                requireContract(typeof pgImage.capabilities.postgres === 'string'
                  && /^18\.[0-9]+$/.test(pgImage.capabilities.postgres), 'sac-pg18-unqualified');
              }
              const runtime = qualifyRuntime(native ? value.nativeRuntime : value.hostedRuntime, !native);
              const paths = LEAF_PATHS[selected.profile];
              requireContract(exactKeys(value.leafSources, paths)
                && paths.every(path => digest(value.leafSources[path])), 'leaf-source-closure-unqualified');
              let leafSources = value.leafSources;
              if (selected.suite === 'dev-release') {
                const releasePaths = ['.github/ci/build-in-sif.sh', '.github/ci/release-identity.py', '.github/ci/publish-in-sif.sh'];
                requireContract(exactKeys(value.releaseSources, releasePaths)
                  && releasePaths.every(path => digest(value.releaseSources[path])), 'release-source-closure-unqualified');
                leafSources = {...leafSources, ...value.releaseSources};
              }
              return {profile: selected.profile, suite: selected.suite, versions: selected.versions, image, pgImage, runtime,
                leafSources, pgBin: value.pgBin,
                pgVersion: pgImage ? pgImage.capabilities.postgres : value.pgVersion, native};
            }
            // END SIF_CONTRACT
            const plan = planFor(context.payload.repository.full_name, context.eventName,
              process.env.NATIVE_AUTHORIZED === 'true', PROFILES, process.env.SIF_SUITE);
            core.setOutput('plan', JSON.stringify(plan));
            core.setOutput('versions', JSON.stringify(plan.versions));
            core.setOutput('profile', plan.profile);
            core.setOutput('suite', plan.suite);
            if (plan.suite === 'dev-release') {
              // BEGIN DEV_RELEASE_SOURCE
              function releaseRequest(repository, event, ref, requested, workflow) {
                requireContract(repository === 'scitex-ai/scitex-dev', 'release-repository-refused');
                requireContract(['push', 'workflow_dispatch'].includes(event), 'release-event-refused');
                const tag = event === 'push' ? ref.replace(/^refs\/tags\//, '') : requested;
                requireContract(/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag), 'release-tag-refused');
                requireContract(event === 'push' ? ref === `refs/tags/${tag}` : ref === 'refs/heads/main', 'release-ref-refused');
                requireContract(workflow === `${repository}/.github/workflows/pypi-publish-and-github-release-on-tag.yml@${ref}`, 'release-caller-refused');
                return {tag, event};
              }
              function qualifyReleaseSource(request, commit, eventSha, before, comparison, after) {
                requireContract(/^[a-f0-9]{40}$/.test(commit), 'release-commit-refused');
                requireContract(request.event !== 'push' || commit === eventSha, 'release-tag-event-mismatch');
                requireContract(before.name === 'main' && before.protected === true
                  && /^[a-f0-9]{40}$/.test(before.commit.sha), 'release-main-unprotected');
                requireContract(request.event !== 'workflow_dispatch' || before.commit.sha === eventSha,
                  'release-dispatch-source-changed');
                requireContract(after.name === before.name && after.protected === true
                  && after.commit.sha === before.commit.sha, 'release-main-changed');
                requireContract(['ahead', 'identical'].includes(comparison.status)
                  && comparison.base_commit.sha === commit && comparison.merge_base_commit.sha === commit,
                  'release-not-promoted-to-main');
                return {tag: request.tag, commit};
              }
              // END DEV_RELEASE_SOURCE
              const request = releaseRequest(context.payload.repository.full_name, context.eventName,
                context.ref, process.env.RELEASE_TAG, process.env.CALLER_WORKFLOW_REF);
              let object = (await github.rest.git.getRef({...context.repo, ref: `tags/${request.tag}`})).data.object;
              for (let depth = 0; object.type === 'tag' && depth < 4; depth++) {
                requireContract(/^[a-f0-9]{40}$/.test(object.sha), 'release-tag-object-invalid');
                object = (await github.rest.git.getTag({...context.repo, tag_sha: object.sha})).data.object;
              }
              requireContract(object.type === 'commit', 'release-tag-target-refused');
              const before = (await github.rest.repos.getBranch({...context.repo, branch: 'main'})).data;
              const comparison = (await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${object.sha}...${before.commit.sha}`,
              })).data;
              const after = (await github.rest.repos.getBranch({...context.repo, branch: 'main'})).data;
              const identity = qualifyReleaseSource(request, object.sha, context.sha, before, comparison, after);
              core.setOutput('tag', identity.tag);
              core.setOutput('commit', identity.commit);
              core.setOutput('identity_sha256', plan.leafSources['.github/ci/release-identity.py']);
            }

  test-dev:
    needs: [runner-admission, profile]
    if: needs.profile.outputs.profile == 'dev' && (needs.profile.outputs.suite == 'matrix' || needs.profile.outputs.suite == 'dev-release')
    name: test-dev-py${{ matrix.python-version }}
    runs-on: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
          && fromJSON('["ubuntu-latest"]')
          || fromJSON(needs.runner-admission.outputs.runs_on) }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.profile.outputs.versions) }}
    env:
      CI_XDIST_WORKERS: ${{ inputs.ci_xdist_workers }}
    steps:
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted Spartan pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1
      - name: Require confirmed organization membership on native runners
        if: runner.environment == 'self-hosted' && needs.runner-admission.outputs.native_authorized != 'true'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout
        with:
          ref: ${{ needs.profile.outputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the immutable release checkout
        if: needs.profile.outputs.suite == 'dev-release'
        env:
          RELEASE_COMMIT: ${{ needs.profile.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - name: Verify source/runtime and acquire whole images
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: inputs
        env:
          PLAN: ${{ needs.profile.outputs.plan }}
          NATIVE_CI_SIF: ${{ vars.SCITEX_CI_SIF }}
          NATIVE_PG_SIF: ${{ vars.SCITEX_CI_PG_SIF }}
        with:
          script: |
            // BEGIN SIF_FILE_GATE
            const fs = require('fs');
            const fsp = fs.promises;
            const path = require('path');
            const crypto = require('crypto');
            const plan = JSON.parse(process.env.PLAN);
            const deadline = Date.now() + 15 * 60 * 1000;
            function check(value, reason) { if (!value) throw new Error(reason); }
            function timeFence() { check(Date.now() < deadline, 'image-acquisition-deadline'); }
            async function regularBytes(file, expected, expectedSize = null) {
              timeFence();
              const handle = await fsp.open(file, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW);
              try {
                const before = await handle.stat();
                check(before.isFile() && (expectedSize === null || before.size === expectedSize), 'file-metadata-mismatch');
                const hash = crypto.createHash('sha256');
                const chunk = Buffer.alloc(1024 * 1024);
                let count = 0;
                while (true) {
                  timeFence();
                  const {bytesRead} = await handle.read(chunk, 0, chunk.length, null);
                  if (!bytesRead) break;
                  count += bytesRead;
                  check(count <= before.size, 'file-size-changed');
                  hash.update(chunk.subarray(0, bytesRead));
                }
                const after = await handle.stat();
                const current = await fsp.lstat(file);
                timeFence();
                check(after.dev === before.dev && after.ino === before.ino && after.size === before.size
                  && after.mtimeMs === before.mtimeMs && after.ctimeMs === before.ctimeMs
                  && current.dev === before.dev && current.ino === before.ino
                  && count === before.size && hash.digest('hex') === expected, 'file-byte-pin-mismatch');
              } finally { await handle.close(); }
            }
            const workspace = path.resolve(process.env.GITHUB_WORKSPACE);
            for (const [relative, digest] of Object.entries(plan.leafSources)) {
              let current = workspace;
