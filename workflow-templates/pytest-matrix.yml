name: tests

# CANONICAL CALLER STUB — copy this verbatim. Do not rename the job.
#
# The job id `pytest-matrix` is NOT cosmetic. GitHub names the status check of a
# reusable-workflow call:
#
#     "<caller job id> / <job name inside the reusable workflow>"
#
# so the job id below IS the branch-protection context prefix. With `pytest-matrix`
# every repo in the ecosystem emits exactly:
#
#     pytest-matrix / pytest-matrix-on-ubuntu-py3.11
#     pytest-matrix / pytest-matrix-on-ubuntu-py3.12
#     pytest-matrix / pytest-matrix-on-ubuntu-py3.13
#
# One required-status-check list then serves every repo. Rename the job to
# `test`, `call`, `ci`, … and that repo emits `test / pytest-matrix-on-ubuntu-py3.11`
# instead — a bespoke protection list for that repo, forever, and a merge that
# blocks silently until someone hand-reads the new names off a real PR.
#
# ─────────────────────────────────────────────────────────────────────────
# AND BEFORE YOU DELETE THE LEGACY WORKFLOW THIS STUB REPLACES: ENUMERATE
# WHICH OF ITS CONTEXTS ARE REQUIRED, ON EVERY PROTECTED BRANCH.
#
#     gh api repos/{owner}/{repo}/branches/{branch}/protection
#
# The rename above is not only a cosmetic mismatch — if the OLD bare context
# is REQUIRED, nothing will ever publish it again once the legacy file is
# gone. The separator in `<caller-job> / <callee-job>` is structural, so no
# caller configuration can restore the bare name. Protection then waits
# forever and NO PR CAN FIX IT; only an admin protection edit can.
#
# THIS IS NOT VISIBLE FROM THE WORKFLOW FILES. Measured 2026-08-18: `audit`
# is required on figrecipe and not on scitex-app, from files that look
# identical; and figrecipe's own develop and main protection sets differ from
# each other. Neither a sibling repo nor your own other branch settles it.
#
# SAFE ORDER: add this caller ALONGSIDE the legacy workflow (both run,
# nothing required changes) → open a throwaway PR and READ the names GitHub
# actually publishes, rather than deriving them from this comment → update
# the required contexts while BOTH sets still publish → only then delete the
# legacy file. At no point is a required context unpublished, and every step
# is reversible.
#
# scitex-app ran that order on 2026-08-18 and its throwaway probe caught two
# separate would-be-permanent deadlocks before either reached protection.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly, off-peak
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest-matrix:            # <-- DO NOT RENAME (see above)
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main

    # ONE secret, mapped explicitly. This stub used to say `secrets: inherit`,
    # which forwards EVERY secret your repo holds into these jobs — measured
    # 2026-08-03, scitex-ui and scitex-hpc each hold CLAUDE_CODE_CREDENTIALS_JSON
    # (the fleet Claude credential), which nothing in pytest-matrix touches.
    # PS-224 flags the pattern.
    #
    # IF YOUR REPO HAS NO CODECOV_TOKEN, DELETE THESE TWO LINES ENTIRELY rather
    # than leaving them — an unset secret maps to empty, and coverage upload
    # then fails as `Token required because branch is protected` while the step
    # still reports success (`fail_ci_if_error: false`). Measured across all 50
    # consumer repos: exactly ONE (scitex-io) holds the token, so for almost
    # every repo copying this stub, DELETING is the correct action.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
